<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DBI – Datenbanken und Informationssysteme · 3. Jahrgang</title>
<meta name="description" content="Selbstlernplattform DBI für den 3. Jahrgang – HTL Pinkafeld">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EE; --card:#FFFFFF; --card2:#FBF3E6; --line:#EADBC4; --txt:#262626; --muted:#6B6359;
  --or:#F6A01D; --or-l:#FFE4C3; --or-d:#B86B00; --nv:#1D4E9A; --nv-l:#DCE7F5; --gr:#3E8E41; --gr-l:#E2F0DC; --gr-d:#24592A;
  --rd:#C0392B; --rd-l:#F8DEDA; --vi:#6A4C93; --vi-l:#EAE2F4; --code:#263238; --code-txt:#ECEFF1;
  --shadow:0 2px 10px rgba(90,60,20,.08); --r:14px;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace; --sans:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17140F; --card:#221E18; --card2:#2A251D; --line:#3B342A; --txt:#F2ECE3; --muted:#B3A898;
  --or-l:#4A3517; --or-d:#F6B04D; --nv:#7FA7E6; --nv-l:#1E2C44; --gr-l:#1E3320; --gr-d:#8FCB92; --rd-l:#4A2420; --rd:#F08A7E; --vi-l:#2E2540; --vi:#B9A0E0;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#17140F; --card:#221E18; --card2:#2A251D; --line:#3B342A; --txt:#F2ECE3; --muted:#B3A898;
  --or-l:#4A3517; --or-d:#F6B04D; --nv:#7FA7E6; --nv-l:#1E2C44; --gr-l:#1E3320; --gr-d:#8FCB92; --rd-l:#4A2420; --rd:#F08A7E; --vi-l:#2E2540; --vi:#B9A0E0;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--nv)}
code,.mono{font-family:var(--mono);font-size:.9em}
:not(pre)>code{background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:0 .3em}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h2{font-size:1.55rem;font-weight:800}
h3{font-size:1.1rem;font-weight:700;margin-top:1.4em}
.en{font-style:italic;color:var(--muted);font-weight:400}
/* layout */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--or);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--txt);min-width:0;flex:1}
.brand>span{min-width:0}
.logo{width:38px;height:38px;flex:none}
.brand b{display:block;font-size:1rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:.75rem}
.top .sp{flex:0}
a.btn{display:inline-block;text-decoration:none}
@media (max-width:600px){.tabs{position:static}.hide-sm{display:none}.hero .deco{display:none}.hero h1{max-width:none}.brand b{font-size:.9rem}.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top{gap:6px}.iconbtn{padding-left:9px;padding-right:9px}.mhead .big{font-size:2.2rem}}
.iconbtn{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:10px;height:38px;min-width:38px;padding:0 10px;cursor:pointer;font:600 .85rem var(--sans);display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{border-color:var(--or)}
#menuBtn{display:none}
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 62px)}
nav.side{border-right:1px solid var(--line);padding:14px 10px;background:var(--card);position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
nav.side a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;text-decoration:none;color:var(--txt);font-size:.9rem}
nav.side a:hover{background:var(--card2)}
nav.side a.on{background:var(--or-l);font-weight:700}
nav.side a.off{color:var(--muted)}
nav.side .num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 .75rem var(--sans);background:var(--nv-l);color:var(--nv)}
nav.side a.done .num{background:var(--gr);color:#fff}
nav.side .grp{font:700 .7rem var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 4px}
main{padding:28px clamp(16px,4vw,48px) 80px;max-width:1080px;width:100%}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)} #menuBtn{display:inline-flex}
  nav.side{position:fixed;left:0;top:62px;bottom:0;width:280px;height:auto;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  nav.side.open{transform:none}
}
/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font:700 .75rem var(--sans);background:var(--or);color:#fff}
.pill.nv{background:var(--nv)} .pill.gr{background:var(--gr)} .pill.rd{background:var(--rd)} .pill.mu{background:var(--line);color:var(--muted)}
.box{border-radius:12px;padding:12px 16px;margin:14px 0;border-left:5px solid}
.merke{background:var(--or-l);border-color:var(--or)} .warn{background:var(--rd-l);border-color:var(--rd)} .ok{background:var(--gr-l);border-color:var(--gr)} .info{background:var(--nv-l);border-color:var(--nv)}
.box b:first-child{display:block;margin-bottom:2px}
pre.sql{background:var(--code);color:var(--code-txt);border-radius:12px;padding:14px 16px;overflow:auto;font:14px/1.55 var(--mono);margin:12px 0}
pre.sql .k{color:#F6A01D;font-weight:600} pre.sql .s{color:#A5D6A7} pre.sql .c{color:#90A4AE;font-style:italic} pre.sql .t{color:#82B1FF} pre.sql .n{color:#FFCC80}
table.dt{border-collapse:collapse;font-size:.88rem;margin:10px 0;min-width:100%}
.tw{overflow:auto;max-width:100%}
table.dt th{background:var(--nv);color:#fff;text-align:left;padding:5px 10px;font-weight:700;white-space:nowrap}
:root[data-theme="dark"] table.dt th{background:#2D4F86}
table.dt td{padding:4px 10px;border-bottom:1px solid var(--line);white-space:nowrap;transition:background .25s,opacity .25s}
table.dt tr.hl td{background:var(--or-l)} table.dt tr.dim td{opacity:.3} table.dt td.null{color:var(--rd);font-style:italic}
table.dt td.hc{background:var(--or-l)} table.dt th.hc{background:var(--or)}
table.dt th.pk{text-decoration:underline}
.btn{border:0;border-radius:10px;background:var(--or);color:#fff;font:700 .9rem var(--sans);padding:9px 16px;cursor:pointer}
.btn:hover{filter:brightness(1.05)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.nv{background:var(--nv)} .btn.gr{background:var(--gr)} .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.sm{padding:5px 11px;font-size:.8rem}
select,input[type=text],input[type=number],textarea{font:15px var(--sans);color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
textarea{width:100%;font-family:var(--mono);font-size:14px;min-height:80px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;cursor:pointer;font:600 .85rem var(--sans);color:var(--txt)}
.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.muted{color:var(--muted)} .small{font-size:.85rem}
/* home */
.hero{background:linear-gradient(120deg,var(--nv),#2E6BC4);color:#fff;border-radius:20px;padding:28px 28px 24px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;margin:6px 0 8px}
.hero p{margin:0;max-width:640px;opacity:.95}
.hero .deco{position:absolute;right:-70px;top:-70px;width:190px;height:190px;border:24px solid rgba(246,160,29,.55);transform:rotate(45deg);border-radius:20px;pointer-events:none}
.hero>*:not(.deco){position:relative;z-index:1}
.hero h1{max-width:80%}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gr);border-radius:9px;transition:width .4s}
.hero .bar{background:rgba(255,255,255,.25);max-width:420px;margin-top:14px}
.mcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--txt);transition:transform .15s,border-color .15s;position:relative}
.mcard:hover{transform:translateY(-2px);border-color:var(--or)}
.mcard .mn{font:800 1.9rem var(--sans);color:var(--or)}
.mcard.soon{opacity:.6}
.mcard .badge{position:absolute;top:14px;right:14px}
/* module page */
.mhead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.mhead .big{font:800 3rem/1 var(--sans);color:var(--or)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 6px;position:sticky;top:62px;z-index:10;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:99px;padding:5px 12px;font:600 .82rem var(--sans);cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.tab.on{background:var(--nv);border-color:var(--nv);color:#fff}
.tab .d{width:8px;height:8px;border-radius:50%;background:var(--line)} .tab.done .d{background:var(--gr)}
.sec{margin-top:10px}
.secnav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}
/* quiz */
.q{margin:14px 0}
.q .qt{font-weight:700;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer;font:15px var(--sans)}
.opt:hover{border-color:var(--nv)} .opt.right{background:var(--gr-l);border-color:var(--gr)} .opt.wrong{background:var(--rd-l);border-color:var(--rd)}
.fb{margin-top:8px;padding:8px 12px;border-radius:9px;font-size:.92rem;display:none}
.fb.show{display:block} .fb.r{background:var(--gr-l)} .fb.w{background:var(--rd-l)}
.score{font:800 2rem var(--sans);color:var(--gr)}
/* flashcards */
.flip{perspective:900px;height:120px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:grid;place-items:center;text-align:center;padding:10px;font-weight:700;border:1px solid var(--line)}
.flip .f{background:var(--card)} .flip .b{background:var(--nv);color:#fff;transform:rotateY(180deg);font-style:italic}
/* misc visuals */
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;position:relative}
.tl .ev{border-top:4px solid var(--c,var(--nv));background:var(--card);border-radius:10px;padding:10px;box-shadow:var(--shadow)}
.tl .ev b{color:var(--c,var(--nv))}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow .st{background:var(--c,var(--nv));color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;transition:transform .3s,opacity .3s}
.flow .st.dim{opacity:.3} .flow .ar{color:var(--muted);font-weight:800}
.mini{display:grid;gap:2px;width:max-content;margin:10px auto}
.mini i{display:block;width:22px;height:14px;background:var(--line);border-radius:2px}
.mini i.h{background:var(--nv)} .mini i.on{background:var(--or)}
.term{cursor:pointer}
.sev{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.kbd{font:700 .8rem var(--mono);background:var(--nv);color:#fff;border-radius:6px;padding:2px 7px}
.hide-print{}
@media print{
  .top,nav.side,.tabs,.secnav,.hide-print,.btn{display:none!important}
  .wrap{display:block} body{background:#fff} .card{box-shadow:none} main{max-width:none;padding:0}
}
.foot{margin-top:50px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:14px}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Beamer-Modus */
.flip{height:auto;min-height:120px}
.flip .in{min-height:120px;display:grid}
.flip .f,.flip .b{position:relative;inset:auto;grid-area:1/1;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto;font-size:.95rem;line-height:1.25;min-width:0}
.mcard,.mcard b,.tl .ev,.tl .ev b,.hero h1,.sec h2,.card h3{overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto;min-width:0}
.tl{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
html.beamer .g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
html.beamer .g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
@media (max-width:600px){.hero h1{font-size:1.45rem}}
/* Modul 4/5 Bausteine */
.mono{font-family:var(--mono)}
.machine{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:center}
.machine .ar{font-size:1.6rem;color:var(--muted)}
.machine .mi{display:flex;flex-direction:column;gap:4px;align-items:center}
.machine .mi small{color:var(--muted);font-weight:700}
.machine .mbox{background:var(--or);color:#fff;border-radius:14px;padding:14px 16px;display:flex;gap:8px;align-items:center;font-weight:800}
.machine .mbox select{font-weight:800}
.outbig{font:700 1.3rem var(--mono);color:var(--nv);min-width:120px;text-align:center}
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.cell{min-width:38px;border:1px solid var(--line);border-radius:8px;background:var(--card);display:flex;flex-direction:column;align-items:center;padding:4px 2px;transition:background .2s}
.cell b{font:700 1.15rem var(--mono)} .cell small{font-size:.7rem;color:var(--muted)} .cell small.neg{color:var(--rd);opacity:.8;min-height:1em}
.cell.on{background:var(--or);border-color:var(--or)} .cell.on b,.cell.on small{color:#fff}
.cell.fx{outline:3px solid var(--nv);outline-offset:-1px} .cell.off{opacity:.35} .cell.sep{border:none;background:none;min-width:12px}
.res{display:flex;flex-direction:column;gap:2px;background:var(--card2);border-radius:12px;padding:10px 14px;margin-top:8px}
.res small{font-weight:700;color:var(--muted)} .res>b{font:700 1.4rem var(--mono);color:var(--or)}
.outv{font:700 1.15rem var(--mono);white-space:pre-wrap;word-break:break-all;color:var(--nv)} .outv i.sp{color:var(--rd);font-style:normal;opacity:.6}
.grp{display:inline-grid;grid-template-columns:repeat(6,14px);gap:3px;padding:5px;border:2px solid var(--nv);border-radius:8px}
.grp i{width:14px;height:14px;border-radius:50%;background:var(--nv)} .grp.rest{border-color:var(--or)} .grp.rest i{background:var(--or)}
.dpart{display:flex;flex-direction:column;align-items:center;background:var(--c);color:#fff;border-radius:8px;padding:4px 8px;min-width:42px}
.dpart b{font-family:var(--mono)} .dpart small{font-size:.65rem;opacity:.9}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:320px;margin:0 auto}
.cal .ch{grid-column:1/-1;text-align:center;font-weight:800;margin-bottom:4px}
.cal i{font-style:normal;text-align:center;padding:5px 0;border-radius:6px;font-size:.85rem;background:var(--card2)}
.cal i:empty{background:none} .cal i.wd{background:none;font-weight:700;color:var(--muted);font-size:.75rem}
.cal i.late{background:color-mix(in srgb,var(--nv) 12%,var(--card2))}
.cal i.sel{background:var(--or);color:#fff;font-weight:800} .cal i.nx{outline:2px solid var(--gr)} .cal i.last{outline:2px dashed var(--rd)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;margin-top:8px}
.lg{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--card2)} .lg.sel{background:var(--or)} .lg.nx{outline:2px solid var(--gr)} .lg.last{outline:2px dashed var(--rd)} .lg.late{background:color-mix(in srgb,var(--nv) 12%,var(--card2))}
.conv{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:12px 0}
.conv .ty{background:var(--c);color:#fff;font-weight:800;border-radius:12px;padding:10px 16px}
.conv .ca{font:700 .8rem var(--mono);text-align:center;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:6px} .stp{opacity:.5;transition:opacity .3s;overflow-wrap:anywhere} .stp.on{opacity:1}
.dgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr)}@media (max-width:800px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.wrapcode code{white-space:normal;overflow-wrap:anywhere}
.solh{background:var(--card2);border-left:4px solid var(--gr);border-radius:10px;padding:10px 14px;margin-top:10px}
.vchip{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;padding:3px 7px;background:var(--card);min-width:52px}
.vchip small{font-size:.62rem;color:var(--muted)} .vchip b{font:700 .85rem var(--mono)} .vchip.nul b{color:var(--rd);font-style:italic} .vchip.conv{background:var(--or-l,#FDE6C2)}
.aggs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.agg{background:var(--card2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.agg small{font:700 .72rem var(--mono);color:var(--muted);overflow-wrap:anywhere} .agg b{font:700 1.15rem var(--mono);color:var(--or);overflow-wrap:anywhere} .agg.bad b{color:var(--rd);font-size:.85rem}
.steprow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.bucket{border:2px solid var(--c);border-radius:12px;padding:8px 10px;background:var(--card);display:flex;flex-direction:column;gap:2px;min-width:0}
.bucket>b{color:var(--c);font-family:var(--mono);margin-bottom:4px} .bucket span{font-size:.82rem;display:flex;justify-content:space-between;gap:6px} .bucket span i{font-style:normal;font-family:var(--mono);color:var(--muted)}
.bres{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;font-size:.85rem} .bres b{color:var(--c);font-family:var(--mono)}
.hbars{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.hbar{display:grid;grid-template-columns:90px minmax(0,1fr) 90px;gap:8px;align-items:center;transition:opacity .25s}
.hbar .hl{font:700 .8rem var(--mono);overflow-wrap:anywhere} .hbar>b{font-family:var(--mono)} .hbar.out{opacity:.4}
.ht{position:relative;height:18px;background:var(--card2);border-radius:6px}
.ht i{position:absolute;left:0;top:0;bottom:0;background:var(--or);border-radius:6px;transition:width .3s} .hbar.out .ht i{background:var(--muted)}
.ht s{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--rd)}
.nest{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.nest>div{display:flex;flex-direction:column;gap:4px;background:var(--card2);border-radius:12px;padding:10px 14px} .nest small{font-weight:700;color:var(--muted)} .nest span.top b{color:var(--or)} .nest .ar{font-size:1.6rem;color:var(--muted)}
.phases{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;justify-content:center}
.phases .ar{align-self:center;color:var(--muted);font-weight:800}

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const STORE_KEY = "dbi3-progress-v1";
let P = {};
try { P = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { P = {}; }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(P)); } catch (e) {} }
const mp = id => (P[id] = P[id] || {done: {}, quiz: 0});
function markDone(id, sec){ mp(id).done[sec] = 1; P.last = id; save(); }
function modProgress(m){
  if (!m.sections) return 0;
  const keys = m.sections.map(s => s.id);
  const d = mp(m.id).done;
  return Math.round(100 * keys.filter(k => d[k]).length / keys.length);
}

function quizHTML(qs, id){
  return `<div id="quiz-${id}">${qs.map((q, i) => {
    let body = "";
    if (q.type === "num") body = `<div class="row"><input type="number" style="width:120px" data-qn="${i}"><button class="btn sm nv" data-qc="${i}">Prüfen</button></div>`;
    else if (q.type === "match") {
      const rights = shuffle(q.pairs.map(p => p[1]));
      body = q.pairs.map((p, j) => `<div class="row" style="margin:6px 0"><span style="min-width:180px">${p[0]}</span> → <select data-qm="${i}" data-j="${j}"><option value="">– wählen –</option>${rights.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join("")}</select></div>`).join("") + `<button class="btn sm nv" data-qc="${i}">Prüfen</button>`;
    } else body = q.opts.map((o, j) => `<button class="opt" data-q="${i}" data-o="${j}">${o}</button>`).join("");
    return `<div class="q card"><div class="qt">${i + 1}. ${q.q}</div>${q.code ? sql(q.code) : ""}${body}<div class="fb" id="fb-${id}-${i}"></div></div>`;
  }).join("")}
  <div class="card" style="text-align:center"><div class="muted">Dein Ergebnis</div><div class="score" id="sc-${id}">0 / ${qs.length}</div><button class="btn ghost sm" data-qreset>Nochmal versuchen</button></div></div>`;
}
function quizInit(el, qs, id){
  const st = qs.map(() => null);
  const upd = () => {
    const n = st.filter(x => x === true).length;
    $(`#sc-${id}`, el).textContent = `${n} / ${qs.length}`;
    if (st.every(x => x !== null)) { const m = mp(id); m.quiz = Math.max(m.quiz || 0, Math.round(100 * n / qs.length)); markDone(id, "quiz"); refreshNav(); }
  };
  const fb = (i, ok) => { const f = $(`#fb-${id}-${i}`, el); f.className = "fb show " + (ok ? "r" : "w"); f.innerHTML = `<b>${ok ? "✓ Richtig!" : "✗ Leider nicht."}</b> <span>${qs[i].why || ""}</span>`; };
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-q]");
    if (b) {
      const i = +b.dataset.q; if (st[i] !== null) return;
      const ok = +b.dataset.o === qs[i].a; st[i] = ok;
      $$(`[data-q="${i}"]`, el).forEach(x => { if (+x.dataset.o === qs[i].a) x.classList.add("right"); });
      if (!ok) b.classList.add("wrong");
      fb(i, ok); upd(); return;
    }
    const c = e.target.closest("[data-qc]");
    if (c) {
      const i = +c.dataset.qc; if (st[i] !== null) return; const q = qs[i]; let ok;
      if (q.type === "num") ok = +$(`[data-qn="${i}"]`, el).value === q.a;
      else ok = $$(`[data-qm="${i}"]`, el).every(s => s.value === q.pairs[+s.dataset.j][1]);
      if (q.type === "match" && !ok) fb(i, false), $(`#fb-${id}-${i}`, el).innerHTML += "<br><b>Lösung:</b> " + q.pairs.map(p => `<span>${p[0]}</span> → <b>${p[1]}</b>`).join(" · ");
      else fb(i, ok);
      st[i] = ok; upd(); return;
    }
    if (e.target.closest("[data-qreset]")) render();
  });
}

function go(h){

function modulePage(m, secId){
  if (!m.sections) return `<div class="mhead"><span class="big">${String(m.n).padStart(2, "0")}</span><div><span class="pill mu">Foliensatz ${m.deck}</span><h2 style="margin-top:6px">${m.title}</h2><p class="muted">${m.sub}</p></div></div>
    <div class="card" style="margin-top:16px"><h3 style="margin-top:0">🚧 Dieses Modul ist in Arbeit</h3><p>Geplante Inhalte:</p><ul>${(m.plan || []).map(x => `<li>${x}</li>`).join("")}</ul><p class="muted small">Bis dahin: Foliensatz ${m.deck} aus dem Unterricht und das passende SQL-Notebook.</p></div>`;
  const secs = m.sections;
  const idx = Math.max(0, secs.findIndex(s => s.id === secId));
  const s = secs[idx];
  const d = mp(m.id).done;
  const html = `<div class="mhead fade"><span class="big">${String(m.n).padStart(2, "0")}</span><div style="flex:1;min-width:240px"><span class="pill nv">Foliensatz ${m.deck}</span> <span class="pill mu">${modProgress(m)} % erledigt</span><h2 style="margin-top:6px">${m.title}</h2><p class="muted" style="margin:0">${m.sub}</p></div></div>
  <nav class="tabs">${secs.map(x => `<a class="tab ${x.id === s.id ? "on" : ""} ${d[x.id] ? "done" : ""}" href="#/m/${m.id}/${x.id}"><span class="d"></span>${x.t}</a>`).join("")}</nav>
  <section class="sec fade" id="sec">${typeof s.html === "function" ? s.html() : s.html}</section>
  <div class="secnav">${idx > 0 ? `<a class="btn ghost" href="#/m/${m.id}/${secs[idx - 1].id}" style="text-decoration:none">← ${secs[idx - 1].t}</a>` : "<span></span>"}
  ${["quiz"].includes(s.id) ? "" : `<button class="btn gr" id="doneBtn">${d[s.id] ? "✓ erledigt" : "Abschnitt erledigt ✓"}${idx < secs.length - 1 ? " – weiter →" : ""}</button>`}</div>`;
  return {html, after(){
    const el = $("#sec");
    if (s.init) s.init(el);
    const b = $("#doneBtn");
    if (b) b.onclick = () => { markDone(m.id, s.id); if (idx < secs.length - 1) go(`#/m/${m.id}/${secs[idx + 1].id}`); else render(); };
    P.last = m.id; save();
  }};
}
function render(){
  const h = ROUTE || "#/";
  const app = $("#app"); let after = null;
  const parts = h.slice(2).split("/");
  if (parts[0] === "m") {
    const m = MODULES.find(x => x.id === parts[1]) || MODULES[0];
    const r = modulePage(m, parts[2]);
    if (typeof r === "string") app.innerHTML = r; else { app.innerHTML = r.html; after = r.after; }
  } else if (parts[0] === "glossar") app.innerHTML = glossar();
  else if (parts[0] === "info") app.innerHTML = info();
  else app.innerHTML = home();
  app.innerHTML += `<div class="foot">DBI · 3. Jahrgang · HTL Pinkafeld – Selbstlernplattform (Prototyp). Datenbasis: Oracle-Beispielschema SCOTT.</div>`;
  if (after) after();
  const gq = $("#gq"); if (gq) gq.oninput = () => { const v = gq.value.toLowerCase().trim(); $$("#gt tbody tr").forEach(r => r.style.display = !v || r.dataset.s.includes(v) ? "" : "none"); };
  const ra = $("#resetAll"); if (ra) ra.onclick = () => { if (ra.dataset.sure) { P = {}; save(); render(); } else { ra.dataset.sure = "1"; ra.textContent = L("Wirklich alles löschen? Nochmal klicken","Really delete everything? Click again"); } };
  refreshNav(); $("#side").classList.remove("open");
  if (!h.includes("/quiz")) window.scrollTo(0, 0);
}

 {id:"heute", t:"Datenbanken heute", html:`<h2>Datenbanken heute – nicht nur Tabellen</h2>

 {id:"acid", t:"Transaktionen & ACID", html:`<h2>Transaktionen: alles oder nichts</h2>
  <p>Eine <b>Transaktion</b> ${en("transaction")} ist eine Folge von Änderungen, die als <b>Einheit</b> ausgeführt wird. Probier die Überweisung von 500 € von A nach B:</p>
  <div class="row"><button class="btn sm" id="s1">1. Abbuchen bei A</button><button class="btn sm" id="s2" disabled>2. Gutschrift bei B</button><button class="btn sm nv" id="cm" disabled>COMMIT</button><button class="btn sm" style="background:var(--rd)" id="crash" disabled>⚡ Absturz!</button><button class="btn sm ghost" id="r0">↺ neu</button></div>
  <div class="grid g2" style="margin-top:12px;max-width:560px" id="acc"></div><div id="tmsg"></div>
  <h3>ACID: die vier Versprechen</h3>

  <p class="small muted">In SQL: <code>COMMIT</code> speichert, <code>ROLLBACK</code> verwirft – mehr dazu in Modul 12.</p>`,
  init(el){
   let A = 1000, B = 200, step = 0, committed = {A:1000, B:200};
   const draw = (msg) => {
    $("#acc", el).innerHTML = `<div class="card" style="text-align:center">🏦 <b>Konto A</b><div style="font:800 1.8rem var(--sans);color:var(--nv)">${A} €</div></div><div class="card" style="text-align:center">🏦 <b>Konto B</b><div style="font:800 1.8rem var(--sans);color:var(--nv)">${B} €</div></div>`;
    $("#tmsg", el).innerHTML = msg || "";
    $("#s1", el).disabled = step !== 0; $("#s2", el).disabled = step !== 1; $("#cm", el).disabled = step !== 2; $("#crash", el).disabled = !(step === 1 || step === 2);
   };

const IDX = c => EMP_COLS.indexOf(c);
const likeRe = p => new RegExp("^" + p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/%/g, ".*").replace(/_/g, ".") + "$");
function test(row, col, op, v1, v2){
  let x = row[IDX(col)];
  if (op === "IS NULL") return x === null; if (op === "IS NOT NULL") return x !== null;
  if (x === null) return false;
  const num = typeof x === "number"; const date = col === "HIREDATE";
  const conv = v => { v = String(v).replace(/'/g, "").trim(); return num ? +v : date ? dkey(v) : v; };
  if (date) x = dkey(x);
  if (op === "LIKE") return likeRe(v1).test(String(x));
  if (op === "IN") return v1.split(",").map(s => conv(s.trim().replace(/'/g, ""))).includes(x);
  const a = conv(v1);
  if (op === "BETWEEN") { const b = conv(v2); return x >= a && x <= b; }
  return {"=":x === a,"<>":x !== a,"<":x < a,"<=":x <= a,">":x > a,">=":x >= a}[op];
}
const lit = (col, v) => col === "ENAME" || col === "JOB" ? `'${v}'` : col === "HIREDATE" ? `DATE '${"19" + v.split(".")[2]}-${v.split(".")[1]}-${v.split(".")[0]}'` : v;

 {id:"where", t:"WHERE-Filter", html:`<h2>WHERE: der Filter für Zeilen</h2>

 {id:"reihenfolge", t:"Reihenfolge", html:`<h2>So arbeitet die Datenbank</h2><p>Geschrieben wird <b>SELECT … FROM … WHERE … ORDER BY</b> – ausgeführt aber in einer anderen Reihenfolge. Klicke dich durch:</p>

 {id:"operatoren", t:"BETWEEN · IN · LIKE", html:`<h2>BETWEEN, IN und LIKE</h2>

  <div id="lv" class="row" style="margin-top:12px"></div><div id="lm"></div>`,
  init(el){
   const bd = () => { const a = +$("#b1", el).value, b = +$("#b2", el).value; const srt = EMP.slice().sort((x, y) => x[5] - y[5]);

   $("#b1", el).oninput = bd; $("#b2", el).oninput = bd; bd();

   $("#lp", el).oninput = ld; $("#lpx", el).onclick = e => { const b = e.target.closest("[data-p]"); if (b) { $("#lp", el).value = b.dataset.p; ld(); } }; ld(); }},
 {id:"null", t:"IS NULL", html:`<h2>IS NULL: fehlende Werte finden</h2>

 {id:"logik", t:"AND · OR · NOT", html:`<h2>Bedingungen kombinieren</h2>

 {id:"order", t:"ORDER BY", html:`<h2>ORDER BY: Ergebnis sortieren</h2>
  <p>Ohne ORDER BY gibt es <b>keine garantierte Reihenfolge</b>. Klicke Sortierkriterien an (Reihenfolge zählt!) und wechsle ASC/DESC:</p>
  <div class="row" id="ob">${["DEPTNO","SAL","ENAME","HIREDATE","COMM"].map(c => `<button class="chip" data-c="${c}">${c}</button>`).join("")}<button class="btn sm ghost" id="obr">↺</button></div>
  <div class="row" id="obd" style="margin-top:6px"></div>
  <label class="row" style="margin-top:6px"><input type="checkbox" id="top"> nur die ersten 3 Zeilen (<code>FETCH FIRST 3 ROWS ONLY</code>, ab Oracle 12c)</label>
  <div class="grid g2" style="margin-top:10px"><div id="obq"></div><div id="obt"></div></div>
  ${box("info","Gut zu wissen","ASC (aufsteigend) ist Standard · NULL steht bei ASC <b>am Ende</b> (ändern mit <code>NULLS FIRST</code>) · <code>DESC</code> gilt nur für die Spalte <b>davor</b> · sortieren auch nach Alias oder Spalten außerhalb der SELECT-Liste")}`,
  init(el){ let keys = [];
   const draw = () => {
    $$("#ob .chip", el).forEach(b => b.classList.toggle("on", keys.some(k => k.c === b.dataset.c)));
    $("#obd", el).innerHTML = keys.map((k, i) => `<button class="chip on" data-t="${i}">${i + 1}. ${k.c} ${k.d ? "DESC ↓" : "ASC ↑"}</button>`).join("") + (keys.length ? '<span class="small muted">← klicken: ASC/DESC</span>' : "");
    const val = (e, c) => { const v = e[IDX(c)]; return c === "HIREDATE" ? dkey(v) : v; };
    let rows = EMP.slice().sort((a, b) => { for (const k of keys) { let x = val(a, k.c), y = val(b, k.c);
      if (x === y) continue; if (x === null) return k.d ? -1 : 1; if (y === null) return k.d ? 1 : -1; return (x < y ? -1 : 1) * (k.d ? -1 : 1); } return 0; });

  ${box("info",L("Weitere Zahlenfunktionen","More number functions"),"<code>ABS(-5)</code> = 5 · <code>CEIL(4.1)</code> = 5 · <code>FLOOR(4.9)</code> = 4 · <code>POWER(2, 10)</code> = 1024<br>" + L("Oracle zeigt in Österreich ein <b>Dezimalkomma</b> an – im SQL-Code schreibt man aber immer einen <b>Punkt</b>.","In Austria Oracle displays a <b>decimal comma</b> – but in SQL code you always write a <b>point</b>."))}</div>`,
  init(el){

    $("#mv", el).innerHTML = h + `<span class="small">${a} = ${q} · ${b} + <b style="color:var(--or)">${r}</b></span>`; };
   $$("#ma,#mb", el).forEach(x => x.oninput = md); md(); }},

 {id:"datum", t:L("Datumsfunktionen","Date functions"), html:() => `<h2>${L("Rechnen mit Datum","Calculating with dates")}</h2>

  ${box("merke","Merke",L("Datum − Datum = <b>Tage</b> · Datum + Zahl = <b>Datum</b> · <code>MONTHS_BETWEEN</code> liefert eine <b>Zahl</b>, alle anderen ein <b>DATE</b> · <code>TRUNC(SYSDATE)</code> = heute 0:00 Uhr","date − date = <b>days</b> · date + number = <b>date</b> · <code>MONTHS_BETWEEN</code> returns a <b>number</b>, all others a <b>DATE</b> · <code>TRUNC(SYSDATE)</code> = today 0:00"))}
  ${sql("SELECT ename, ROUND((SYSDATE - hiredate) / 7) AS wochen\nFROM   emp\nWHERE  deptno = 10;\n-- EXTRACT holt einen Teil heraus:\nSELECT ename FROM emp WHERE EXTRACT(YEAR FROM hiredate) = 1981;")}`,
  init(el){
   const pd = v => { const [y, m, d] = v.split("-").map(Number); return y ? D(y, m, d) : null; };
   const draw = () => { const d = pd($("#dd", el).value), b = pd($("#d2", el).value), n = Math.round(+$("#dn", el).value || 0); if (!d) return;
    const iso = x => `DATE '${x.toISOString().slice(0, 10)}'`, A = iso(d);

     [`ROUND(${A}, 'MONTH')`, fd(roundMonth(d))], [`TRUNC(${A}, 'MONTH')`, fd(D(d.getUTCFullYear(), d.getUTCMonth() + 1, 1))], [`ROUND(${A}, 'YEAR')`, fd(roundYear(d))], [`TRUNC(${A}, 'YEAR')`, fd(D(d.getUTCFullYear(), 1, 1))],
     [`EXTRACT(YEAR FROM ${A})`, d.getUTCFullYear()]];
    if (b) rows.push([`MONTHS_BETWEEN(${A}, ${iso(b)})`, cm(rnd(monthsBetween(d, b), 7))], [`${A} - ${iso(b)}`, cm(Math.round((d - b) / 864e5))]);
    $("#dt", el).innerHTML = `<div class="tw"><table class="dt"><tbody>${rows.map(r => `<tr><td><code>${esc(r[0])}</code></td><td class="hc mono"><b>${r[1]}</b></td></tr>`).join("")}</tbody></table></div>`;
    // Kalender des Monats
    const y = d.getUTCFullYear(), m = d.getUTCMonth() + 1, first = (D(y, m, 1).getUTCDay() + 6) % 7, nd = dim(y, m), nx = nextDay(d, 5);
    const wk = L(["Mo","Di","Mi","Do","Fr","Sa","So"], ["Mo","Tu","We","Th","Fr","Sa","Su"]);
    let c = `<div class="cal"><div class="ch">${toCharDate(d, "fmMonth YYYY", LANG)}</div>${wk.map(w => `<i class="wd">${w}</i>`).join("")}${"<i></i>".repeat(first)}`;
    for (let i = 1; i <= nd; i++) { const cls = [i === d.getUTCDate() ? "sel" : "", i === nd ? "last" : "", nx.getUTCMonth() + 1 === m && nx.getUTCDate() === i ? "nx" : "", i >= 16 ? "late" : ""].join(" ");
     c += `<i class="${cls}">${i}</i>`; }
    $("#cal", el).innerHTML = c + `</div><div class="small legend"><span><span class="lg sel"></span> ${L("Datum","date")}</span><span><span class="lg nx"></span> NEXT_DAY</span><span><span class="lg last"></span> LAST_DAY</span><span><span class="lg late"></span> ${L("ab 16.: ROUND → nächster Monat","from the 16th: ROUND → next month")}</span></div>`; };
   $$("#dd,#dn,#d2", el).forEach(x => x.oninput = draw);
   $$("[data-h]", el).forEach(btn => btn.onclick = () => { const e = EMP.find(x => x[1] === btn.dataset.h); $("#dd", el).value = hd(e[4]).toISOString().slice(0, 10); draw(); });

 {id:"konvert", t:L("Konvertierung","Conversion"), html:() => `<h2>${L("Implizit oder explizit umwandeln?","Implicit or explicit conversion?")}</h2>

   <div class="small muted">${L("9 = Ziffer · 0 = führende Null · $ / L = Dollar / lokale Währung (€) · D G = Dezimal- / Gruppenzeichen der Spracheinstellung · . , = fix · #### = Zahl passt nicht ins Format","9 = digit · 0 = leading zero · $ / L = dollar / local currency (€) · D G = decimal / group separator of the language setting · . , = fixed · #### = number does not fit the format")}</div></div>

   <div class="card"><b>TO_DATE</b> – ${L("Text → Datum","text → date")}${sql("TO_DATE('17.11.1981', 'DD.MM.YYYY')  -- 17.11.1981\nTO_DATE('31.02.2026', 'DD.MM.YYYY')\n-- ORA-01839: date not valid for month")}</div></div>
  ${box("merke","Merke",L("Bei TO_NUMBER und TO_DATE beschreibt die Maske, wie der <b>Text aussieht</b> – nicht, wie das Ergebnis aussehen soll.","With TO_NUMBER and TO_DATE the mask describes what the <b>text looks like</b> – not what the result should look like."))}`,

 {id:"null", t:"NULL & CASE", html:() => `<h2>${L("NULL ersetzen: NVL, NVL2, COALESCE","Replacing NULL: NVL, NVL2, COALESCE")}</h2>
  <div class="row" id="nf">${[["calc","sal*12 + comm"],["nvl","sal*12 + NVL(comm, 0)"],["nvl2","NVL2(comm, 'mit', 'ohne')"],["coal","COALESCE(comm, mgr, 0)"],["txt","NVL(TO_CHAR(comm), 'keine')"]].map((f, i) => `<button class="chip ${i ? "" : "on"}" data-f="${f[0]}">${esc(f[1])}</button>`).join("")}</div>
  <div class="grid g2" style="margin-top:10px"><div id="nq"></div><div id="nt"></div></div>
  ${table([L("Funktion","Function"), L("Bedeutung","Meaning")], [["NVL(a, b)",L("a ist NULL → b, sonst a","a is NULL → b, otherwise a")],["NVL2(a, b, c)",L("a nicht NULL → b, sonst c","a not NULL → b, otherwise c")],["COALESCE(a, b, c, …)",L("der erste Wert, der nicht NULL ist","the first value that is not NULL")],["NULLIF(a, b)",L("a = b → NULL, sonst a","a = b → NULL, otherwise a")]])}
  ${box("warn",L("Gleiche Datentypen!","Same data types!"),L("<code>NVL(comm, 'keine')</code> → ORA-01722, weil comm eine Zahl ist. Lösung: <b>verschachteln</b> – <code>NVL(TO_CHAR(comm), 'keine')</code>.","<code>NVL(comm, 'none')</code> → ORA-01722 because comm is a number. Solution: <b>nest</b> – <code>NVL(TO_CHAR(comm), 'none')</code>."))}
  <h2>${L("Funktionen verschachteln","Nesting functions")}</h2><p>${L("Ausgewertet wird <b>von innen nach außen</b>. Klicke dich durch:","Evaluation goes <b>from the inside out</b>. Step through:")}</p>
  <div class="row"><select id="ve">${EMP.map(e => `<option>${e[1]}</option>`).join("")}</select><button class="btn sm" id="vn">${L("Nächster Schritt ▶","Next step ▶")}</button><button class="btn sm ghost" id="vr">↺</button></div><div id="vs" style="margin-top:10px"></div>
  <h2>${L("Bedingungen: CASE und DECODE","Conditions: CASE and DECODE")}</h2>
  <p>${L("Gehaltserhöhung nach Job – stelle die Prozentsätze ein:","Pay rise by job – set the percentages:")}</p>
  <div class="row"><label>CLERK +<input type="number" id="cc" value="10" style="width:60px">%</label><label>SALESMAN +<input type="number" id="cs" value="5" style="width:60px">%</label><label>${L("sonst","else")} +<input type="number" id="ce" value="3" style="width:60px">%</label></div>
  <div class="row" id="cv" style="margin-top:6px"><button class="chip on" data-c="s">Simple CASE</button><button class="chip" data-c="w">Searched CASE</button><button class="chip" data-c="d">DECODE</button></div>
  <div class="grid g2" style="margin-top:8px"><div id="cq"></div><div id="ct"></div></div>
  ${box("warn",L("Die CASE-Falle","The CASE trap"),L("<code>CASE comm WHEN NULL THEN …</code> trifft <b>nie</b> zu – Simple CASE vergleicht mit <code>=</code>. Richtig: <code>CASE WHEN comm IS NULL THEN …</code>","<code>CASE comm WHEN NULL THEN …</code> <b>never</b> matches – simple CASE compares with <code>=</code>. Correct: <code>CASE WHEN comm IS NULL THEN …</code>"))}`,
  init(el){
   const nf = f => { $$("#nf .chip", el).forEach(c => c.classList.toggle("on", c.dataset.f === f));
    const ex = {calc:"sal*12 + comm", nvl:"sal*12 + NVL(comm, 0)", nvl2:"NVL2(comm, 'mit', 'ohne')", coal:"COALESCE(comm, mgr, 0)", txt:"NVL(TO_CHAR(comm), 'keine')"}[f];
    const v = e => ({calc:e[6] === null ? null : e[5] * 12 + e[6], nvl:e[5] * 12 + (e[6] ?? 0), nvl2:e[6] !== null ? "mit" : "ohne", coal:e[6] ?? e[3] ?? 0, txt:e[6] === null ? "keine" : String(e[6])}[f]);
    $("#nq", el).innerHTML = sql(`SELECT ename, sal, comm,\n       ${ex} AS ergebnis\nFROM   emp;`) + (f === "calc" ? box("warn", L("NULL frisst alles","NULL swallows everything"), L("Rechnen mit NULL ergibt NULL – 10 von 14 Jahresgehältern fehlen!","Calculating with NULL gives NULL – 10 of 14 annual salaries are missing!")) : f === "coal" ? `<p class="small">${L("KING: comm und mgr sind NULL → 0","KING: comm and mgr are NULL → 0")}</p>` : "");
    $("#nt", el).innerHTML = table(["ENAME","SAL","COMM",L("ERGEBNIS","RESULT")], EMP.map(e => [e[1], e[5], e[6], v(e)]), {hcols:[3]}); };
   $("#nf", el).onclick = e => { const b = e.target.closest("[data-f]"); if (b) nf(b.dataset.f); }; nf("calc");
   let s = -1; const vs = () => { const e = EMP.find(x => x[1] === $("#ve", el).value); const j = e[2], n = e[1];
    const st = [["SUBSTR(job, 1, 1)", `'${j[0]}'`], ["① || '.' || ename", `'${j[0]}.${n}'`], ["LOWER(②)", `'${(j[0] + "." + n).toLowerCase()}'`], ["③ || '@firma.at'", `'${(j[0] + "." + n).toLowerCase()}@firma.at'`]];
    $("#vs", el).innerHTML = sql(`SELECT LOWER(SUBSTR(job, 1, 1) || '.' || ename) || '@firma.at'\nFROM   emp;   -- ${n}, ${j}`) + `<div class="steps">${st.map((x, i) => `<div class="stp ${i <= s ? "on" : ""}"><span class="pill ${i <= s ? "" : "mu"}">${"①②③④"[i]}</span> <code>${esc(x[0])}</code> → <b class="mono">${i <= s ? esc(x[1]) : "?"}</b></div>`).join("")}</div>`;
    $("#vn", el).disabled = s >= 3; };
   $("#vn", el).onclick = () => { s++; vs(); }; $("#vr", el).onclick = () => { s = -1; vs(); }; $("#ve", el).onchange = () => { s = -1; vs(); }; $("#ve", el).value = "KING"; vs();
   let mode = "s"; const cd = () => { const c = +$("#cc", el).value || 0, sa = +$("#cs", el).value || 0, o = +$("#ce", el).value || 0; const f = p => (1 + p / 100).toFixed(2);
    const code = {s:`SELECT ename, job, sal,\n  ROUND(CASE job WHEN 'CLERK'    THEN sal * ${f(c)}\n                 WHEN 'SALESMAN' THEN sal * ${f(sa)}\n                 ELSE sal * ${f(o)}\n        END) AS neu\nFROM   emp;`,

    $("#gs", el).disabled = step >= 2; };
   $("#gk", el).onclick = e => { const b = e.target.closest("[data-k]"); if (!b) return; keys = b.dataset.k ? b.dataset.k.split(",") : []; $$("#gk .chip", el).forEach(x => x.classList.toggle("on", x === b)); step = 0; draw(); };

 {id:"ziele", t:"Lernziele", html:() => `<h2>Lernziele</h2><div class="grid g2"><div class="card"><b>${L("Nach diesem Modul kannst du …","After this module you can …")}</b><ul>

 {id:"warum", t:L("Wozu Unterabfragen?","Why subqueries?"), html:() => `<h2>${L("Eine Abfrage in der Abfrage","A query inside a query")}</h2>
  <p>${L("„Wer verdient mehr als JONES?“ – das Gehalt von JONES kennen wir nicht. Die <b>Unterabfrage</b> holt es, die <b>Hauptabfrage</b> verwendet es. Wähle eine Person und einen Operator:","“Who earns more than JONES?” – we don't know JONES's salary. The <b>subquery</b> gets it, the <b>outer query</b> uses it. Choose a person and an operator:")}</p>
  <div class="card"><div class="row"><span class="kbd">${L("Person","Person")}</span><span id="wp">${["JONES","BLAKE","CLARK","ALLEN","ADAMS"].map((n, i) => `<button class="chip ${i ? "" : "on"}" data-p="${n}">${n}</button>`).join("")}</span></div>
   <div class="row" style="margin-top:6px"><span class="kbd">${L("Operator","Operator")}</span><span id="wo">${[">","<",">=","<="].map((o, i) => `<button class="chip ${i ? "" : "on"}" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</span></div></div>
  <div class="grid g2" style="margin-top:10px"><div><div class="nest2"><div class="outer"><small>${L("Hauptabfrage","outer query")}</small><div id="wq1"></div><div class="inner"><small>${L("Unterabfrage – läuft zuerst, einmal","subquery – runs first, once")}</small><div id="wq2"></div></div></div></div><div id="wr" style="margin-top:10px"></div></div><div id="wb"></div></div>
  <h3>${L("Wo können Unterabfragen stehen?","Where can subqueries be placed?")}</h3>
  <div class="grid g4">${[["WHERE",L("Zeilen filtern","filter rows"),"var(--nv)"],["HAVING",L("Gruppen filtern","filter groups"),"var(--or)"],["FROM",L("Inline View – wie eine Tabelle","inline view – like a table"),"var(--gr)"],["SELECT",L("skalar – ein Wert pro Zeile","scalar – one value per row"),"var(--rd)"]].map(c => `<div class="card fam" style="--c:${c[2]}"><b>${c[0]}</b><div class="small">${c[1]}</div></div>`).join("")}</div>
  ${box("merke",L("Regeln","Rules"),L("in <b>Klammern</b> · am besten <b>rechts</b> vom Operator · <b>kein ORDER BY</b> in der Unterabfrage im WHERE (ORA-00907) · <b>Operator passend</b> zur Anzahl der Werte","in <b>brackets</b> · preferably to the <b>right</b> of the operator · <b>no ORDER BY</b> in a subquery in WHERE (ORA-00907) · <b>operator matching</b> the number of values"))}`,
  init(el){ let p = "JONES", o = ">";
   const cmp = (a, b) => ({">":a > b, "<":a < b, ">=":a >= b, "<=":a <= b})[o];
   const draw = () => { const v = EMP.find(e => e[1] === p)[5]; const res = SAL.filter(r => cmp(r[1], v));
    $("#wq1", el).innerHTML = sql(`SELECT ename, sal\nFROM   emp\nWHERE  sal ${o}`); $("#wq2", el).innerHTML = sql(`(SELECT sal FROM emp\n WHERE ename = '${p}')`) + `<div class="pill">→ ${v}</div>`;
    $("#wr", el).innerHTML = `<b>${res.length} ${L("Zeilen","rows")}:</b> ${res.map(r => `<span class="pill nv">${r[0]}</span>`).join(" ")}`;
    $("#wb", el).innerHTML = bars(SAL, v, x => cmp(x, v), `${p}: ${v}`); };
   $("#wp", el).onclick = e => { const b = e.target.closest("[data-p]"); if (!b) return; p = b.dataset.p; $$("#wp .chip", el).forEach(x => x.classList.toggle("on", x === b)); draw(); };
   $("#wo", el).onclick = e => { const b = e.target.closest("[data-o]"); if (!b) return; o = b.dataset.o; $$("#wo .chip", el).forEach(x => x.classList.toggle("on", x === b)); draw(); }; draw(); }},

 {id:"single", t:"Single-Row", html:() => `<h2>${L("Gruppenfunktionen in der Unterabfrage","Aggregate functions in the subquery")}</h2>
  <p>${L("Eine Gruppenfunktion ohne GROUP BY liefert <b>genau einen Wert</b>. <code>WHERE sal = MIN(sal)</code> ist verboten – mit Unterabfrage geht es:","An aggregate function without GROUP BY returns <b>exactly one value</b>. <code>WHERE sal = MIN(sal)</code> is not allowed – with a subquery it works:")}</p>
  <div class="card"><div class="row"><span class="kbd">${L("Unterabfrage","Subquery")}</span><span id="sf">${[["MIN(sal)",""],["MAX(sal)",""],["AVG(sal)",""],["AVG(sal)","30"],["MAX(sal)","20"]].map((f, i) => `<button class="chip ${i ? "" : "on"}" data-f="${f[0]}" data-w="${f[1]}">${f[0]}${f[1] ? " · deptno = " + f[1] : ""}</button>`).join("")}</span></div>
   <div class="row" style="margin-top:6px"><span class="kbd">${L("Operator","Operator")}</span><span id="so">${["=",">","<"].map((o, i) => `<button class="chip ${i ? "" : "on"}" data-o="${o}">${esc(o)}</button>`).join("")}</span></div></div>
  <div class="grid g2" style="margin-top:10px"><div id="sq"></div><div id="sb"></div></div>
  <h2>${L("Typische Fehler","Typical mistakes")}</h2>
  <div class="grid g2"><div class="card"><b style="color:var(--rd)">${L("1 · mehrere Zeilen bei = < >","1 · several rows with = < >")}</b>${sql("SELECT ename FROM emp\nWHERE  sal = (SELECT MIN(sal) FROM emp\n              GROUP BY deptno);")}<p>${L("Die Unterabfrage liefert <b>1300, 800, 950</b> →","The subquery returns <b>1300, 800, 950</b> →")} <b style="color:var(--rd)">ORA-01427</b></p><p class="small">${L("Lösung: <code>sal IN (SELECT …)</code> → SMITH, JAMES, MILLER","Solution: <code>sal IN (SELECT …)</code> → SMITH, JAMES, MILLER")}</p></div>
   <div class="card"><b style="color:var(--rd)">${L("2 · Unterabfrage findet nichts","2 · subquery finds nothing")}</b>${sql("SELECT ename, job FROM emp\nWHERE  job = (SELECT job FROM emp\n              WHERE ename = 'SMYTHE');")}<p>${L("liefert NULL → <b>no rows selected</b> – aber <b>kein Fehler</b>! Der Tippfehler bleibt unbemerkt.","returns NULL → <b>no rows selected</b> – but <b>no error</b>! The typo goes unnoticed.")}</p></div></div>
  <h3>${L("Unterabfrage im HAVING","Subquery in HAVING")}</h3>
  <div class="grid g2">${sql("SELECT   deptno, MIN(sal)\nFROM     emp\nGROUP BY deptno\nHAVING   MIN(sal) > (SELECT MIN(sal) FROM emp\n                     WHERE  deptno = 20);   -- 800")}${table(["DEPTNO","MIN(SAL)"], [[10, 1300], [20, 800], [30, 950]], {hlRows:[0, 2], dimRows:[1]})}</div>`,
  init(el){ let f = "MIN(sal)", w = "", o = "=";
   const draw = () => { const base = EMP.filter(e => !w || e[7] === +w).map(e => e[5]); const v = f === "MIN(sal)" ? Math.min(...base) : f === "MAX(sal)" ? Math.max(...base) : avg(base);
    const cmp = x => o === "=" ? x === v : o === ">" ? x > v : x < v; const res = SAL.filter(r => cmp(r[1]));
    $("#sq", el).innerHTML = sql(`SELECT ename, sal\nFROM   emp\nWHERE  sal ${o} (SELECT ${f} FROM emp${w ? "\n                WHERE  deptno = " + w : ""});`) + `<div class="res"><small>${L("Unterabfrage liefert","subquery returns")}</small><b>${nf(v)}</b></div><p><b>${res.length} ${L("Zeilen","rows")}:</b> ${res.map(r => `<span class="pill nv">${r[0]}</span>`).join(" ") || "–"}</p>`;
    $("#sb", el).innerHTML = bars(SAL, v, x => cmp(x), `${f}${w ? " (" + w + ")" : ""} = ${nf(v)}`); };
   $("#sf", el).onclick = e => { const b = e.target.closest("[data-f]"); if (!b) return; f = b.dataset.f; w = b.dataset.w; $$("#sf .chip", el).forEach(x => x.classList.toggle("on", x === b)); draw(); };
   $("#so", el).onclick = e => { const b = e.target.closest("[data-o]"); if (!b) return; o = b.dataset.o; $$("#so .chip", el).forEach(x => x.classList.toggle("on", x === b)); draw(); }; draw(); }},

 {id:"multi", t:"IN · ANY · ALL", html:() => `<h2>${L("Mehrere Werte: IN, ANY, ALL","Several values: IN, ANY, ALL")}</h2>
  <p>${L("Liefert die Unterabfrage <b>mehrere Zeilen</b>, braucht man einen Mehrzeilen-Operator. Wähle die Werte und den Operator:","If the subquery returns <b>several rows</b>, you need a multi-row operator. Choose the values and the operator:")}</p>
  <div class="card"><div class="row"><span class="kbd">${L("Werte","Values")}</span><span id="ms">${SETS.map((s, i) => `<button class="chip ${i ? "" : "on"}" data-s="${i}">${s[1]}</button>`).join("")}</span></div>
   <div class="row" style="margin-top:6px"><span class="kbd">${L("Operator","Operator")}</span><span id="mo">${OPS.map((o, i) => `<button class="chip ${i === 1 ? "on" : ""}" data-o="${i}">${esc(o[0])}</button>`).join("")}</span></div>
   <div id="ml" class="nline"></div></div>
  <div class="grid g2" style="margin-top:10px"><div id="mq"></div><div id="mr"></div></div>
  ${table([L("Ausdruck","Expression"), L("entspricht","equivalent to")], [["= ANY","IN"],["> ANY","> MIN"],["< ANY","< MAX"],["> ALL","> MAX"],["< ALL","< MIN"],["<> ALL","NOT IN"]])}
  <h2>${L("Die NOT-IN-Falle","The NOT IN trap")}</h2>
  <p>${L("Gesucht: alle, die <b>keine</b> Vorgesetzten sind (8 Personen).","Wanted: everyone who is <b>not</b> a manager (8 people).")}</p>
  <label class="row"><input type="checkbox" id="nn"> <code>WHERE mgr IS NOT NULL</code> ${L("in der Unterabfrage ergänzen","add to the subquery")}</label>
  <div id="nv" style="margin-top:8px"></div>`,
  init(el){ let si = 0, oi = 1;
   const draw = () => { const S = SETS[si], O = OPS[oi], vals = S[3].slice().sort((a, b) => a - b); const lo = 600, hi = 5200, X = v => (v - lo) / (hi - lo) * 100;
    const hit = EMP.filter(e => O[1](e[5], vals.map(v => +v.toFixed(2))));
    $("#ml", el).innerHTML = `<div class="nl-axis"></div>${vals.map((v, i) => `<span class="nl-v" style="left:${X(v)}%;top:${i % 2 ? 0 : 17}px"><i style="margin-top:${i % 2 ? 19 : 2}px"></i><small>${nf(v)}</small></span>`).join("")}${EMP.map(e => `<span class="nl-e ${hit.includes(e) ? "on" : ""}" style="left:${X(e[5])}%" title="${e[1]} ${e[5]}"></span>`).join("")}`;
    $("#mq", el).innerHTML = sql(`SELECT ename, sal\nFROM   emp\nWHERE  sal ${O[0]}\n         (${S[2]});`) + `<p>${L("Unterabfrage liefert","subquery returns")}: <b>${vals.map(nf).join(" · ")}</b><br>${O[0]} ≡ <b>${O[2]}</b></p>`;
    $("#mr", el).innerHTML = `<b>${hit.length} ${L("Zeilen","rows")}</b><div class="row" style="gap:4px;margin-top:6px">${SAL.map(r => `<span class="pill ${hit.some(e => e[1] === r[0]) ? "" : "mu"}">${r[0]} ${r[1]}</span>`).join("")}</div>`; };
   $("#ms", el).onclick = e => { const b = e.target.closest("[data-s]"); if (!b) return; si = +b.dataset.s; $$("#ms .chip", el).forEach(x => x.classList.toggle("on", x === b)); draw(); };
   $("#mo", el).onclick = e => { const b = e.target.closest("[data-o]"); if (!b) return; oi = +b.dataset.o; $$("#mo .chip", el).forEach(x => x.classList.toggle("on", x === b)); draw(); }; draw();
   const nv = () => { const ok = $("#nn", el).checked; const mg = [...new Set(EMP.map(e => e[3]))].filter(v => ok ? v !== null : true);
    const res = ok ? EMP.filter(e => !mg.includes(e[0])) : [];
    $("#nv", el).innerHTML = `<div class="grid g2"><div>${sql(`SELECT ename FROM emp\nWHERE  empno NOT IN\n         (SELECT mgr FROM emp${ok ? "\n          WHERE  mgr IS NOT NULL" : ""});`)}<div class="row" style="gap:4px">${mg.map(v => `<span class="pill ${v === null ? "rd" : "nv"}">${v ?? "NULL"}</span>`).join("")}</div></div>
     <div>${ok ? box("ok", `${res.length} ${L("Zeilen","rows")}`, res.map(e => e[1]).join(", ")) : box("warn", L("no rows selected – statt 8!","no rows selected – instead of 8!"), L("<code>empno NOT IN (…, NULL)</code> heißt <code>empno &lt;&gt; … AND empno &lt;&gt; NULL</code>. Der Vergleich mit NULL ist nie TRUE → keine Zeile. Alternative: <b>NOT EXISTS</b>.","<code>empno NOT IN (…, NULL)</code> means <code>empno &lt;&gt; … AND empno &lt;&gt; NULL</code>. The comparison with NULL is never TRUE → no rows. Alternative: <b>NOT EXISTS</b>."))}</div></div>`; };
   $("#nn", el).onchange = nv; nv(); }},

 {id:"spalten", t:L("Spalten · FROM · SELECT","Columns · FROM · SELECT"), html:() => `<h2>${L("Paarweise oder nicht paarweise?","Pairwise or non-pairwise?")}</h2>
  <p>${L("Die Unterabfrage liefert (Abteilung, Job) aller, die mehr als 2500 verdienen. Schalte um:","The subquery returns (department, job) of everyone who earns more than 2500. Switch:")}</p>
  <div class="row" id="pw"><button class="chip on" data-p="1">${L("paarweise","pairwise")}</button><button class="chip" data-p="0">${L("nicht paarweise","non-pairwise")}</button></div>
  <div class="grid g2" style="margin-top:8px"><div id="pq"></div><div id="pt"></div></div>
  <h2>${L("Unterabfrage im FROM: Inline View","Subquery in FROM: inline view")}</h2>
  <div class="grid g2">${sql("SELECT a.ename, a.sal, b.salavg\nFROM   emp a\nJOIN   (SELECT deptno, ROUND(AVG(sal), 2) AS salavg\n        FROM   emp\n        GROUP BY deptno) b\n  ON   a.deptno = b.deptno\nWHERE  a.sal > b.salavg;")}
   <div>${table(["DEPTNO","SALAVG"], [[10,"2916,67"],[20,"2175"],[30,"1566,67"]])}<p class="small">${L("b wirkt wie eine <b>virtuelle Tabelle</b> – sie braucht einen <b>Alias</b>, berechnete Spalten einen Spaltenalias. Ergebnis: KING, JONES, SCOTT, FORD, ALLEN, BLAKE.","b acts like a <b>virtual table</b> – it needs an <b>alias</b>, calculated columns need a column alias. Result: KING, JONES, SCOTT, FORD, ALLEN, BLAKE.")}</p></div></div>
  <h2>${L("Unterabfrage im SELECT: skalar","Subquery in SELECT: scalar")}</h2>
  <div class="grid g2">${sql("SELECT ename, sal,\n       ROUND(sal - (SELECT AVG(sal) FROM emp), 2) AS diff\nFROM   emp\nWHERE  deptno = 10;")}${table(["ENAME","SAL","DIFF"], [["CLARK",2450,"376,79"],["KING",5000,"2926,79"],["MILLER",1300,"-773,21"]], {hcols:[2]})}</div>
  ${box("merke","Merke",L("Skalare Unterabfrage = <b>genau ein Wert</b> · mehr als eine Zeile → ORA-01427 · keine Zeile → NULL","scalar subquery = <b>exactly one value</b> · more than one row → ORA-01427 · no row → NULL"))}`,
  init(el){ const S = EMP.filter(e => e[5] > 2500).map(e => [e[7], e[2]]);
   const draw = pair => { $$("#pw .chip", el).forEach(x => x.classList.toggle("on", +x.dataset.p === +pair));
    const hit = EMP.map((e, i) => (pair ? S.some(s => s[0] === e[7] && s[1] === e[2]) : S.some(s => s[0] === e[7]) && S.some(s => s[1] === e[2])) ? i : -1).filter(i => i >= 0);
    $("#pq", el).innerHTML = sql(pair ? "SELECT ename, deptno, job\nFROM   emp\nWHERE  (deptno, job) IN\n         (SELECT deptno, job FROM emp\n          WHERE  sal > 2500);" : "SELECT ename, deptno, job\nFROM   emp\nWHERE  deptno IN (SELECT deptno FROM emp WHERE sal > 2500)\nAND    job    IN (SELECT job    FROM emp WHERE sal > 2500);")
     + `<p><b>${L("Unterabfrage","Subquery")}:</b> ${S.map(s => `(${s[0]}, ${s[1]})`).join(" · ")}</p><p><b>${hit.length} ${L("Zeilen","rows")}</b>${pair ? "" : L(" – CLARK (10, MANAGER) kommt dazu, obwohl es dieses Paar nicht gibt!"," – CLARK (10, MANAGER) is added, although this pair does not exist!")}</p>`;
    $("#pt", el).innerHTML = table(["ENAME","DEPTNO","JOB","SAL"], EMP.map(e => [e[1], e[7], e[2], e[5]]), {hlRows: hit, dimRows: EMP.map((_, i) => i).filter(i => !hit.includes(i))}); };
   $("#pw", el).onclick = e => { const b = e.target.closest("[data-p]"); if (b) draw(b.dataset.p === "1"); }; draw(true); }},

 {id:"korreliert", t:L("Korreliert & EXISTS","Correlated & EXISTS"), html:() => `<h2>${L("Korreliert: Zeile für Zeile","Correlated: row by row")}</h2>
  <p>${L("Die Unterabfrage verwendet einen Wert der <b>äußeren Zeile</b> (<code>o.deptno</code>) und läuft deshalb <b>für jede Zeile neu</b>: GET → EXECUTE → USE.","The subquery uses a value of the <b>outer row</b> (<code>o.deptno</code>) and therefore runs <b>again for every row</b>: GET → EXECUTE → USE.")}</p>
  <div class="row" id="kv"><button class="chip on" data-v="deptno">${L("Schnitt der Abteilung","department average")}</button><button class="chip" data-v="job">${L("Schnitt des Jobs","job average")}</button>
   <button class="btn sm" id="kn">${L("Nächste Zeile","Next row")} ▶</button><button class="btn sm ghost" id="ka">${L("alle","all")} ⏭</button><button class="btn sm ghost" id="kr">↺</button></div>
  <div class="grid g2" style="margin-top:10px"><div id="kq"></div><div id="kt"></div></div>
  <h2>EXISTS ${L("und","and")} NOT EXISTS</h2>
  <p>${L("EXISTS fragt nur: <b>Gibt es mindestens eine passende Zeile?</b> Klicke auf eine Abteilung:","EXISTS only asks: <b>is there at least one matching row?</b> Click on a department:")}</p>
  <div class="row" id="ed">${DEPT.map(d => `<button class="chip" data-d="${d[0]}">${d[0]} ${d[1]}</button>`).join("")}</div>
  <div class="grid g2" style="margin-top:8px"><div id="eq"></div><div id="er"></div></div>
  ${box("merke","Merke",L("<code>SELECT 1</code> genügt – der Wert ist egal · <b>NOT EXISTS</b> hat keine NULL-Falle wie NOT IN · Faustregel: Werden Spalten aus beiden Tabellen angezeigt → Join, sonst oft Unterabfrage.","<code>SELECT 1</code> is enough – the value doesn't matter · <b>NOT EXISTS</b> has no NULL trap like NOT IN · rule of thumb: columns from both tables shown → join, otherwise often a subquery."))}`,
  init(el){ let by = "deptno", k = -1;
   const draw = () => { const A = by === "deptno" ? (e => DAVG[e[7]]) : (e => JAVG[e[2]]); const col = by === "deptno" ? 7 : 2; const cur = k >= 0 && k < 14 ? EMP[k] : null;
    $("#kq", el).innerHTML = sql(`SELECT ename, sal, ${by}\nFROM   emp o\nWHERE  sal > (SELECT AVG(sal)\n              FROM   emp i\n              WHERE  i.${by} = o.${by});`) +
     (cur ? `<div class="steps"><div class="stp on"><span class="pill nv">GET</span> ${cur[1]}, ${by} = <b>${cur[col]}</b></div><div class="stp on"><span class="pill">EXECUTE</span> <code>… WHERE i.${by} = ${typeof cur[col] === "number" ? cur[col] : "'" + cur[col] + "'"}</code> → <b>${nf(A(cur))}</b></div><div class="stp on"><span class="pill ${cur[5] > A(cur) ? "gr" : "rd"}">USE</span> ${cur[5]} &gt; ${nf(A(cur))} → <b>${cur[5] > A(cur) ? L("behalten ✓","keep ✓") : L("verwerfen ✗","discard ✗")}</b></div></div>` : `<p class="muted small">${L("Klicke auf „Nächste Zeile“.","Click “Next row”.")}</p>`);
    const done = EMP.slice(0, k + 1);
    $("#kt", el).innerHTML = table(["ENAME","SAL",by.toUpperCase(),L("AVG INNEN","AVG INNER"),""], EMP.map((e, i) => i <= k ? [e[1], e[5], e[col], nf(A(e)), e[5] > A(e) ? "✓" : "–"] : [e[1], e[5], e[col], "", ""]),
     {hlRows: done.map((e, i) => e[5] > A(e) ? i : -1).filter(i => i >= 0), dimRows: EMP.map((_, i) => i).filter(i => i > k)}) + (k >= 13 ? `<p><b>${EMP.filter(e => e[5] > A(e)).length} ${L("Zeilen","rows")}</b> – ${L("die innere Abfrage lief 14-mal.","the inner query ran 14 times.")}</p>` : "");
    $("#kn", el).disabled = k >= 13; };
   $("#kv", el).onclick = e => { const b = e.target.closest("[data-v]"); if (!b) return; by = b.dataset.v; k = -1; $$("#kv .chip", el).forEach(x => x.classList.toggle("on", x === b)); draw(); };

// ===================================================================== ER-Zeichenhilfen (SVG, Chen-Notation)
const ER = (() => {
  const E = (x, y, t, o = {}) => { const w = o.w || 112, h = 40;
    return `<g class="ek ${o.cls || ""}" ${o.k ? `data-k="${o.k}"` : ""}><rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="3"/>${o.weak ? `<rect x="${x - w / 2 + 4}" y="${y - h / 2 + 4}" width="${w - 8}" height="${h - 8}" rx="2"/>` : ""}<text x="${x}" y="${y + 5}">${t}</text></g>`; };
  const R = (x, y, t, o = {}) => { const w = o.w || 104, h = 56;
    const pts = (d) => `${x - w / 2 + d},${y} ${x},${y - h / 2 + d * 0.55} ${x + w / 2 - d},${y} ${x},${y + h / 2 - d * 0.55}`;
    return `<g class="rk ${o.cls || ""}" ${o.k ? `data-k="${o.k}"` : ""}><polygon points="${pts(0)}"/>${o.ident ? `<polygon points="${pts(8)}"/>` : ""}<text x="${x}" y="${y + 4}" class="sm">${t}</text></g>`; };
  const A = (x, y, t, o = {}) => { const rx = o.rx || 50, ry = 16;

 {id:"loeschen", t:L("DROP · TRUNCATE · DELETE","DROP · TRUNCATE · DELETE"), html:() => `<h2>${L("Löschen, Leeren – und zurückholen?","Drop, truncate – and get it back?")}</h2>

 {id:"labor", t:L("Constraint-Labor","Constraint lab"), html:() => `<h2>${L("Constraint-Labor: Welches INSERT scheitert?","Constraint lab: which INSERT fails?")}</h2>
  <div class="grid g2"><div>${sql("CREATE TABLE mitarbeiter (\n  id     NUMBER(4)    CONSTRAINT ma_pk       PRIMARY KEY,\n  name   VARCHAR2(20) CONSTRAINT ma_name_nn  NOT NULL,\n  email  VARCHAR2(40) CONSTRAINT ma_email_uk UNIQUE,\n  gehalt NUMBER(7,2)  CONSTRAINT ma_geh_ck   CHECK (gehalt > 0),\n  deptno NUMBER(2)    CONSTRAINT ma_dept_fk  REFERENCES dept\n);")}
   <div class="row" id="lc">${[["pk","PK"],["nn","NOT NULL"],["uk","UNIQUE"],["ck","CHECK"],["fk","FK"]].map(c => `<label class="chip-cb"><input type="checkbox" data-c="${c[0]}" checked> ${c[1]}</label>`).join("")}</div><p class="small muted">${L("Schalte Constraints aus und sieh, was dann alles in die Tabelle kommt.","Switch constraints off and see what gets into the table then.")}</p></div>
   <div class="card"><b>INSERT INTO mitarbeiter VALUES (…)</b><div class="row" style="margin-top:6px"><input type="text" id="fi" placeholder="id" value="7" style="width:60px"><input type="text" id="fn" placeholder="name" value="Roth" style="width:90px"><input type="text" id="fe" placeholder="email" value="" style="width:110px"><input type="text" id="fg" placeholder="gehalt" value="2000" style="width:80px"><select id="fd">${["NULL",10,20,30,40,50,99].map(d => `<option ${d === 20 ? "selected" : ""}>${d}</option>`).join("")}</select></div>
    <div class="row" style="margin-top:8px"><button class="btn sm nv" id="fx">INSERT ▶</button><button class="btn sm" id="fu">${L("Folien-Übung 2 abspielen","play slide exercise 2")}</button><button class="btn sm ghost" id="fr">↺</button></div><p class="small muted">${L("Leeres Feld = NULL","empty field = NULL")}</p></div></div>
  <div class="grid g2" style="margin-top:10px"><div id="lg"></div><div id="lt"></div></div>`,
  init(el){ let rows = [], log = [];
   const on = c => $(`#lc [data-c="${c}"]`, el).checked;
   const tryIns = r => { const [i, n, e, g, d] = r;
    if (on("nn") && (n === null || n === "")) return ["nn"];
    if (on("pk") && (i === null || rows.some(x => x[0] === i))) return [i === null ? "nn" : "pk"];
    if (on("uk") && e !== null && rows.some(x => x[2] === e)) return ["uk"];
    if (on("ck") && g !== null && !(g > 0)) return ["ck"];
    if (on("fk") && d !== null && !DEPTS.includes(d)) return ["fk"];
    return null; };
   const run = r => { const f = tryIns(r); const txt = `INSERT … VALUES (${r.map(v => v === null ? "NULL" : typeof v === "string" ? `'${v}'` : v).join(", ")})`;
    if (f) { const er = f[0] === "nn" && r[1] !== null && r[0] === null ? ["ORA-01400", "cannot insert NULL into (\"MITARBEITER\".\"ID\")"] : ERR[f[0]]; log.push([txt, false, `${er[0]} – ${er[1]}`]); } else { rows.push(r); log.push([txt, true, L("1 Zeile eingefügt","1 row inserted")]); } };
   const draw = () => { $("#lg", el).innerHTML = log.length ? log.map(l => `<div class="logl ${l[1] ? "ok" : "no"}"><code>${esc(l[0])}</code><br><b>${l[1] ? "✓" : "✗"} ${esc(l[2])}</b></div>`).join("") : `<p class="muted">${L("Noch keine INSERTs.","No INSERTs yet.")}</p>`;
    $("#lt", el).innerHTML = `<div class="cap">MITARBEITER – ${rows.length} ${L("Zeilen","rows")}</div>` + table(["ID","NAME","EMAIL","GEHALT","DEPTNO"], rows.length ? rows : [[" ", " ", " ", " ", " "]]); };
   const val = (s, num) => { s = s.trim(); if (s === "" || s.toUpperCase() === "NULL") return null; return num ? +s : s; };
   $("#fx", el).onclick = () => { run([val($("#fi", el).value, 1), val($("#fn", el).value), val($("#fe", el).value), val($("#fg", el).value, 1), val($("#fd", el).value, 1)]); draw(); };
   $("#fu", el).onclick = () => { rows = []; log = []; EX2.forEach(run); draw(); };
   $("#fr", el).onclick = () => { rows = []; log = []; draw(); }; draw(); }},

 {id:"fk", t:"FOREIGN KEY", html:() => `<h2>${L("Fremdschlüssel: Eltern und Kinder","Foreign keys: parents and children")}</h2>

   $("#od", el).onclick = e => { const b = e.target.closest("[data-o]"); if (b) { o = b.dataset.o; draw(); } }; $("#dd", el).onclick = e => { const b = e.target.closest("[data-d]"); if (b) { d = +b.dataset.d; draw(); } }; draw(); }},

 {id:"check", t:"CHECK & DEFAULT", html:() => `<h2>CHECK: ${L("eigene Regeln","own rules")}</h2>
  <div class="card"><div class="row" id="cr">${[["sal > 0","sal",""],["note BETWEEN 1 AND 5","note",""],["geschlecht IN ('m','w','d')","geschlecht",""],["rueckgabe >= ausleihe","rueckgabe","ausleihe"]].map((c, i) => `<button class="chip ${i ? "" : "on"}" data-i="${i}">${c[0]}</button>`).join("")}</div>
   <div class="row" style="margin-top:8px" id="ci"></div><div id="cv" style="margin-top:8px"></div></div>
  <div class="grid g2"><div class="box ok" style="margin:0"><b>${L("erlaubt","allowed")}</b>${L("Vergleiche, BETWEEN, IN, LIKE · mehrere Spalten derselben Zeile","comparisons, BETWEEN, IN, LIKE · several columns of the same row")}</div><div class="box warn" style="margin:0"><b>${L("nicht erlaubt","not allowed")}</b>${L("Unterabfragen · SYSDATE, USER · andere Zeilen","subqueries · SYSDATE, USER · other rows")}</div></div>

  <div class="grid g2">${sql("CREATE TABLE bestellung (\n  id     NUMBER GENERATED AS IDENTITY\n         CONSTRAINT best_id_pk PRIMARY KEY,\n  datum  DATE DEFAULT SYSDATE,\n  status VARCHAR2(10) DEFAULT ON NULL 'neu'\n);")}${table(["", L("Wirkung","Effect")], [["DEFAULT SYSDATE",L("Wert fehlt → heutiges Datum","value missing → today's date")],["DEFAULT ON NULL 'neu'",L("auch bei explizitem NULL → 'neu'","also with explicit NULL → 'neu'")],["GENERATED AS IDENTITY",L("fortlaufende Nummer 1, 2, 3 …","consecutive number 1, 2, 3 …")]])}</div>
  ${box("info",L("Merke","Remember"),L("DEFAULT weist nichts ab – er füllt nur fehlende Werte. Darum ist er kein echter Constraint. · <code>GETDATE()</code> gibt es in Oracle nicht (SQL Server) → SYSDATE.","DEFAULT doesn't reject anything – it only fills missing values. That's why it is not a real constraint. · <code>GETDATE()</code> doesn't exist in Oracle (SQL Server) → SYSDATE."))}`,
  init(el){ let i = 0;
   const R = [[{v:"sal", d:"2500"}], [{v:"note", d:"6"}], [{v:"geschlecht", d:"x"}], [{v:"ausleihe", d:"2026-11-10", t:"date"}, {v:"rueckgabe", d:"2026-11-01", t:"date"}]];
   const test = vals => { const x = vals.map(v => v === "" ? null : v);

    return [() => +x[0] > 0, () => +x[0] >= 1 && +x[0] <= 5, () => ["m", "w", "d"].includes(x[0]), () => x[1] >= x[0]][i](); };
   const draw = () => { $$("#cr .chip", el).forEach(c => c.classList.toggle("on", +c.dataset.i === i));
    $("#ci", el).innerHTML = R[i].map(f => `<label>${f.v} <input type="${f.t || "text"}" data-v="${f.v}" value="${f.d}" style="width:${f.t ? 150 : 90}px"></label>`).join("") + `<button class="btn sm ghost" id="cn">= NULL</button>`;
    const go = () => { const vals = $$("#ci input", el).map(x => x.value); const r = test(vals); const expr = $(`#cr [data-i="${i}"]`, el).textContent;
     $("#cv", el).innerHTML = r === null ? box("ok", L("✓ erlaubt – NULL besteht jeden CHECK","✓ allowed – NULL passes every CHECK"), L("Die Bedingung ergibt UNKNOWN, nicht FALSE. Für einen Pflichtwert zusätzlich NOT NULL.","The condition is UNKNOWN, not FALSE. For a mandatory value add NOT NULL.")) : r ? box("ok", "✓ " + L("erlaubt","allowed"), `CHECK (${expr}) = TRUE`) : box("warn", "ORA-02290: check constraint violated", `CHECK (${expr}) = FALSE`); };
    $$("#ci input", el).forEach(x => x.oninput = go); $("#cn", el).onclick = () => { $$("#ci input", el)[0].value = ""; go(); }; go(); };

"en": "<i>SAVEPOINT:</i> Run the steps and write down as a comment what is still there after each <code>ROLLBACK TO</code>.<br>• everyone gets <b>€100</b> more salary → <code>SAVEPOINT a</code><br>• all <b>CLERKs</b> are deleted → <code>SAVEPOINT b</code><br>• department <b>50 DEVELOPMENT (DETROIT)</b> is inserted<br>• <code>ROLLBACK TO b</code> → check · <code>ROLLBACK TO a</code> → check · <code>ROLLBACK</code> → check",
"code": null,
"sol": "UPDATE my_emp SET sal = sal + 100;                     -- 16 rows updated\nSAVEPOINT a;\nDELETE FROM my_emp WHERE job = 'CLERK';                -- 4 rows deleted\nSAVEPOINT b;\nINSERT INTO my_dept (deptno, dname, loc) VALUES (50, 'DEVELOPMENT', 'DETROIT');\n\nROLLBACK TO b;\nSELECT COUNT(*) FROM my_dept;                          -- 3 – nur das INSERT ist weg\nSELECT COUNT(*) FROM my_emp WHERE job = 'CLERK';       -- 0 – die CLERKs sind noch gelöscht\n\nROLLBACK TO a;\nSELECT COUNT(*) FROM my_emp WHERE job = 'CLERK';       -- 4 – wieder da\nSELECT sal FROM my_emp WHERE ename = 'KING';           -- 5100 – die Erhöhung ist noch aktiv\n\nROLLBACK;\nSELECT sal FROM my_emp WHERE ename = 'KING';           -- 5000 – alles seit dem letzten COMMIT verworfen"

  <div class="grid g2">${sql("UPDATE emp SET deptno = 55\nWHERE  deptno = 10;")}${box("warn","ORA-02291","integrity constraint (FK_DEPTNO) violated – parent key not found<br>" + L("Abteilung 55 gibt es nicht. Constraints werden bei <b>jedem</b> INSERT, UPDATE und DELETE geprüft.","Department 55 doesn't exist. Constraints are checked on <b>every</b> INSERT, UPDATE and DELETE."))}</div>`,
  init(el){ let s = 0, w = 0;
   const W = [e => e[0] === 7782, e => e[2] === "CLERK", e => e[7] === 10, e => e[1] === "BLAKE", () => true];

   const COLS = [[7], [5], [6], [2, 5]];
   const draw = () => { $$("#us .chip", el).forEach(x => x.classList.toggle("on", +x.dataset.i === s)); $$("#uw .chip", el).forEach(x => x.classList.toggle("on", +x.dataset.i === w));
    const after = EMP.map(e => e.slice()); const hit = []; after.forEach((e, i) => { if (W[w](EMP[i])) { S[s](e); hit.push(i); } });

   $("#us", el).onclick = e => { const b = e.target.closest("[data-i]"); if (b) { s = +b.dataset.i; draw(); } };
   $("#uw", el).onclick = e => { const b = e.target.closest("[data-i]"); if (b) { w = +b.dataset.i; draw(); } }; draw(); }},

 {id:"delete", t:"DELETE", html:() => `<h2>${L("DELETE: Zeilen entfernen","DELETE: removing rows")}</h2>

 {id:"tcl", t:L("Transaktionen","Transactions"), html:() => `<h2>${L("Transaktion = alles oder nichts","Transaction = all or nothing")}</h2>
  <div class="grid g2">${sql("UPDATE konto SET saldo = saldo - 200\nWHERE  nr = 'A';\nUPDATE konto SET saldo = saldo + 200\nWHERE  nr = 'B';\nCOMMIT;")}<div class="card"><div class="row" id="kb"><button class="btn sm" data-k="1">${L("Schritt 1","step 1")}</button><button class="btn sm" data-k="2">${L("Schritt 2","step 2")}</button><button class="btn sm nv" data-k="c">COMMIT</button><button class="btn sm" data-k="x">⚡ ${L("Strom weg","power cut")}</button><button class="btn sm ghost" data-k="r">↺</button></div><div id="kv" style="margin-top:8px"></div></div></div>
  <h2>${L("Transaktions-Labor","Transaction lab")}</h2>
  <p>${L("Tabelle <code>t(x NUMBER)</code>, Auto-Commit aus. Klicke Befehle – oder spiele die Folien-Übung 2 Schritt für Schritt ab.","Table <code>t(x NUMBER)</code>, auto-commit off. Click commands – or play slide exercise 2 step by step.")}</p>
  <div class="card"><div class="row" id="tb"><button class="btn sm" data-c="ins">INSERT <span id="tn">1</span></button><button class="btn sm nv" data-c="commit">COMMIT</button><button class="btn sm" data-c="rb">ROLLBACK</button><button class="btn sm" data-c="sp">SAVEPOINT sp</button><button class="btn sm" data-c="rbsp">ROLLBACK TO sp</button><button class="btn sm" data-c="ddl">CREATE TABLE …</button><button class="btn sm ghost" data-c="reset">↺</button></div>
   <div class="row" style="margin-top:8px"><button class="btn sm" id="tp">▶ ${L("Folien-Übung 2: nächster Schritt","slide exercise 2: next step")}</button><span id="tps" class="small muted"></span></div></div>
  <div class="grid g2" style="margin-top:10px"><div id="tlog"></div><div id="tst"></div></div>
  <h2>${L("Zwei Sitzungen: Wer sieht was?","Two sessions: who sees what?")}</h2>
  ${table(["", L("Sitzung 1 (ich)","Session 1 (me)"), L("Sitzung 2 (Kollegin)","Session 2 (colleague)")], [["1","UPDATE emp SET sal = 9999 WHERE ename = 'KING';","SELECT sal … → 5000"],["2","SELECT sal … → 9999",L("UPDATE … SET sal = 1 … ⏳ wartet (Sperre)","UPDATE … SET sal = 1 … ⏳ waits (lock)")],["3","COMMIT;",L("SELECT sal … → 9999 (jetzt sichtbar)","SELECT sal … → 9999 (now visible)")]])}
  ${box("info",L("Automatisch","Automatic"),L("<b>COMMIT:</b> jede DDL (CREATE, ALTER, DROP, TRUNCATE) · normales Beenden von SQL*Plus/SQLcl · Auto-Commit im Tool<br><b>ROLLBACK:</b> Absturz · Verbindungsabbruch","<b>COMMIT:</b> every DDL (CREATE, ALTER, DROP, TRUNCATE) · normal exit of SQL*Plus/SQLcl · auto-commit in the tool<br><b>ROLLBACK:</b> crash · connection lost"))}`,
  init(el){
   // Konto
   let k = {A:500, B:100}, kc = {A:500, B:100}, ks = 0, kmsg = "";
   const kd = () => { $("#kv", el).innerHTML = table([L("Konto","Account"), L("gespeichert","committed"), L("aktuell (meine Sitzung)","current (my session)")], [["A", kc.A + " €", k.A + " €"],["B", kc.B + " €", k.B + " €"]], {hlRows: k.A !== kc.A || k.B !== kc.B ? [0, 1] : []}) + (kmsg ? `<p class="small">${kmsg}</p>` : ""); };
   $("#kb", el).onclick = e => { const b = e.target.closest("[data-k]"); if (!b) return; const c = b.dataset.k;
    if (c === "1" && ks === 0) { k.A -= 200; ks = 1; kmsg = L("Offene Transaktion – A ist schon belastet, B noch nicht.","Open transaction – A has been charged, B not yet."); }
    else if (c === "2" && ks === 1) { k.B += 200; ks = 2; kmsg = L("Beide Schritte erledigt – noch nicht gespeichert.","Both steps done – not saved yet."); }
    else if (c === "c") { kc = {...k}; ks = 0; kmsg = "✓ " + L("Gespeichert – für alle sichtbar.","Saved – visible to everyone."); }
    else if (c === "x") { k = {...kc}; ks = 0; kmsg = "⚡ " + L("Automatisches ROLLBACK – die 200 € sind nicht verloren.","Automatic ROLLBACK – the €200 are not lost."); }
    else if (c === "r") { k = {A:500, B:100}; kc = {...k}; ks = 0; kmsg = ""; }
    else kmsg = L("Erst den vorigen Schritt ausführen.","Run the previous step first.");
    kd(); }; kd();
   // Labor
   let rows = [], saved = [], sp = null, n = 1, log = [], ps = 0;
   const PLAY = [["ins",1],["ins",2],["commit"],["ins",3],["sp"],["ins",4],["rbsp"],["ins",5],["ddl"],["ins",6],["rb"]];
   const exec = (c, v) => {
    if (c === "ins") { v = v ?? n; rows.push(v); n = Math.max(n, v) + 1; log.push([`INSERT INTO t VALUES (${v});`, ""]); }
    if (c === "commit") { saved = rows.slice(); sp = null; log.push(["COMMIT;", L("gespeichert","saved")]); }
    if (c === "rb") { rows = saved.slice(); sp = null; log.push(["ROLLBACK;", L("zurück zum letzten COMMIT","back to the last COMMIT")]); }
    if (c === "sp") { sp = rows.length; log.push(["SAVEPOINT sp;", L(`Zwischenstand nach ${rows.length} Zeilen`, `checkpoint after ${rows.length} rows`)]); }
    if (c === "rbsp") { if (sp === null) log.push(["ROLLBACK TO sp;", "ORA-01086: savepoint 'SP' never established"]); else { rows = rows.slice(0, sp); log.push(["ROLLBACK TO sp;", L("Transaktion bleibt offen","transaction stays open")]); } }
    if (c === "ddl") { saved = rows.slice(); sp = null; log.push(["CREATE TABLE t2 (y NUMBER);", L("DDL → automatisches COMMIT!","DDL → automatic COMMIT!")]); }
    if (c === "reset") { rows = []; saved = []; sp = null; n = 1; log = []; ps = 0; } };
   const td = () => { $("#tn", el).textContent = n;
    $("#tlog", el).innerHTML = log.length ? log.map(l => `<div class="logl ${/ORA/.test(l[1]) ? "no" : ""}"><code>${esc(l[0])}</code>${l[1] ? `<br><small>${l[1]}</small>` : ""}</div>`).join("") : `<p class="muted">${L("Noch keine Befehle.","No commands yet.")}</p>`;
    $("#tst", el).innerHTML = `<div class="cap">${L("Tabelle t – meine Sitzung","table t – my session")}</div><div class="cells">${rows.length ? rows.map((r, i) => `<span class="cell" style="${saved.includes(r) ? "" : "border-style:dashed;background:var(--or-l)"}">${r}</span>${sp === i + 1 ? `<span class="pill nv">sp</span>` : ""}`).join("") : `<span class="muted">${L("leer","empty")}</span>`}</div>
     <div class="cap" style="margin-top:10px">${L("gespeichert – sehen alle","committed – everyone sees")}</div><div class="cells">${saved.length ? saved.map(r => `<span class="cell">${r}</span>`).join("") : `<span class="muted">${L("leer","empty")}</span>`}</div>
     <p class="small muted">${L("gestrichelt = noch nicht gespeichert","dashed = not saved yet")}</p>${ps === PLAY.length ? box("ok", L("Ergebnis: 1, 2, 3, 5","Result: 1, 2, 3, 5"), L("4 fiel durch ROLLBACK TO sp weg, 6 durch das letzte ROLLBACK. 3 und 5 hat das CREATE TABLE gespeichert.","4 was removed by ROLLBACK TO sp, 6 by the last ROLLBACK. 3 and 5 were saved by CREATE TABLE.")) : ""}`;
    $("#tps", el).textContent = ps ? `${ps} / ${PLAY.length}` : ""; };
   $("#tb", el).onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; if (ps) { exec("reset"); } exec(b.dataset.c); td(); };
   $("#tp", el).onclick = () => { if (ps === 0 || ps === PLAY.length) { exec("reset"); } const [c, v] = PLAY[ps]; exec(c, v); ps++; td(); };
   td(); }},

 {id:"konsistenz", t:L("Lesekonsistenz & Sperren","Read consistency & locks"), html:() => `<h2>${L("Zwei Sitzungen – wer sieht was?","Two sessions – who sees what?")}</h2>

  ${box("warn",L("Merke","Remember"),L("Schlägt eine Anweisung fehl, nimmt Oracle <b>nur diese eine Anweisung</b> zurück – frühere Änderungen der Transaktion bleiben! Die Transaktion ist noch offen: selbst mit ROLLBACK (oder COMMIT) beenden.","If a statement fails, Oracle rolls back <b>only that one statement</b> – earlier changes of the transaction stay! The transaction is still open: end it yourself with ROLLBACK (or COMMIT)."))}
  <h2>${L("Status der Daten","State of the data")}</h2>
  ${table(["", L("vor COMMIT / ROLLBACK","before COMMIT / ROLLBACK"), L("nach COMMIT","after COMMIT"), L("nach ROLLBACK","after ROLLBACK")], [[L("eigene Sitzung sieht","own session sees"), L("neue Werte","new values"), L("neue Werte","new values"), L("alte Werte","old values")],[L("andere Sitzungen sehen","other sessions see"), L("alte Werte","old values"), L("neue Werte","new values"), L("alte Werte","old values")],[L("geänderte Zeilen","changed rows"), L("gesperrt 🔒","locked 🔒"), L("frei","free"), L("frei","free")],[L("alter Zustand","old state"), L("im UNDO – wiederherstellbar","in UNDO – recoverable"), L("verloren","lost"), L("wiederhergestellt","restored")],["Savepoints", L("gültig","valid"), L("gelöscht","deleted"), L("gelöscht","deleted")]])}`,

    $("#klog", el).innerHTML = `<div class="cap">${L("Protokoll","log")}</div>` + (log.length ? log.slice(-6).map(l => `<div class="logl ${l[1]}"><b>${l[0]}</b> ${l[2]}</div>`).join("") : `<p class="muted">${L("Noch nichts passiert.","Nothing happened yet.")}</p>`); };
   const add = (who, cls, t) => log.push([who, cls, t]);
