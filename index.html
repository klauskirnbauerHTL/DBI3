    if (a === "upd") { if (bVal !== null) add("A", "no", L("⏳ wartet – Zeile ist von B gesperrt","⏳ waits – row is locked by B")); else if (lockA) add("A", "", L("Zeile gehört schon A – Wert bleibt 2000.","row already belongs to A – value stays 2000.")); else { lockA = true; cur = 2000; add("A", "", "UPDATE: sal = 2000 " + L("(offen)","(open)")); } }
    if (a === "sel") add("A", "", bVal !== null ? L(`sieht ${saved} – aus dem UNDO (B ist noch offen)`, `sees ${saved} – from UNDO (B is still open)`) : L(`sieht ${cur}`, `sees ${cur}`) + (lockA ? L(" – eigene offene Änderung"," – own open change") : ""));
    if (a === "commit") { if (lockA) { saved = cur; lockA = false; add("A", "", L("COMMIT – 2000 für alle sichtbar, Sperre frei","COMMIT – 2000 visible to all, lock released")); if (waitB) { waitB = false; cur = 1; lockA = false; bVal = 1; add("B", "", L("wartendes UPDATE läuft jetzt: sal = 1 (offen)","waiting UPDATE now runs: sal = 1 (open)")); } } else add("A", "", L("nichts zu speichern","nothing to save")); }
    if (a === "rb") { if (lockA) { cur = saved; lockA = false; add("A", "no", L(`ROLLBACK – alter Wert ${saved} aus dem UNDO zurück`, `ROLLBACK – old value ${saved} restored from UNDO`)); if (waitB) { waitB = false; cur = 1; bVal = 1; add("B", "", L("wartendes UPDATE läuft jetzt: sal = 1 (offen)","waiting UPDATE now runs: sal = 1 (open)")); } } else add("A", "", L("nichts zu verwerfen","nothing to discard")); }
    draw(); };
   $("#kb2", el).onclick = e => { const b = e.target.closest("[data-b]"); if (!b) return; const a = b.dataset.b;

    if (a === "commit") { if (bVal !== null) { saved = cur; bVal = null; add("B", "", L("COMMIT – 1 gespeichert","COMMIT – 1 saved")); } else add("B", "", waitB ? L("wartet noch …","still waiting …") : L("nichts zu speichern","nothing to save")); }
    if (a === "reset") { cur = 3000; saved = 3000; lockA = false; waitB = false; bVal = null; log = []; }
    draw(); };
   draw();
   let k = {A:300, B:300}, step = 0, msg = "";

 {id:"dml", t:L("DML über Views","DML through views"), html:() => `<h2>${L("DML-Labor: Was geht durch welche View?","DML lab: what works through which view?")}</h2>

  <h2>${L("Wann geht DML nicht?","When does DML not work?")}</h2>
  ${table([L("View enthält …","View contains …"), "DELETE", "UPDATE", "INSERT"], [[L("Gruppenfunktionen / GROUP BY","group functions / GROUP BY"),"✗","✗","✗"],["DISTINCT","✗","✗","✗"],[L("ROWNUM / SET-Operator","ROWNUM / set operator"),"✗","✗","✗"],[L("Ausdruck (z. B. sal * 14)","expression (e.g. sal * 14)"),"✓",L("✗ diese Spalte","✗ this column"),"✗"],[L("NOT-NULL-Spalte fehlt","NOT NULL column missing"),"✓","✓","✗"]])}
  ${box("merke",L("Faustregel","Rule of thumb"),L("Jede View-Zeile muss <b>genau einer</b> Tabellenzeile entsprechen – und DML über die View ändert immer die <b>Basistabelle</b>.","Each view row must correspond to <b>exactly one</b> table row – and DML through the view always changes the <b>base table</b>."))}`,

   const draw = () => { $$("#dv .chip", el).forEach(x => x.classList.toggle("on", +x.dataset.v === v)); const V = VIEWS[v];
    $("#dvd", el).innerHTML = V[1]; $("#dvs", el).innerHTML = sql(V[2]);
    $("#da", el).innerHTML = ACT[V[0]].map((a, i) => `<button class="btn sm" data-a="${i}" style="text-align:left;white-space:pre-wrap;font-family:var(--mono);font-size:.78rem">${esc(a[0])}</button>`).join("");
    $("#dr", el).innerHTML = `<p class="muted">${L("Klicke eine Anweisung an.","Click a statement.")}</p>`; };
   $("#dv", el).onclick = e => { const b = e.target.closest("[data-v]"); if (b) { v = +b.dataset.v; draw(); } };
   $("#da", el).onclick = e => { const b = e.target.closest("[data-a]"); if (!b) return; const a = ACT[VIEWS[v][0]][+b.dataset.a];

    $("#dr", el).innerHTML = box(a[1] ? "ok" : "warn", (a[1] ? "✓ " : "✗ ") + a[2], a[3]); };

 {id:"schutz", t:L("Schutz-Optionen","Protection options"), html:() => `<h2>WITH CHECK OPTION: ${L("nicht aus dem Fenster fallen","don't fall out of the window")}</h2>

  <div class="grid g2" style="margin-top:10px"><div id="swin"></div><div id="smsg"></div></div>
  <h2>${L("CHECK OPTION mit Bedingung","CHECK OPTION with a condition")}</h2>
  <div class="grid g2">${sql("CREATE OR REPLACE VIEW empvu2800sal AS\n  SELECT empno, ename, sal FROM emp\n  WHERE  sal > 2800\n  WITH CHECK OPTION CONSTRAINT empvu2800sal_ck;")}<div>${table(["EMPNO","ENAME","SAL"], EMP.filter(e => e[5] > 2800).map(e => [e[0], e[1], e[5]]))}<p class="small">${L("<code>SET sal = 3100</code> für JONES ✓ · <code>SET sal = 2500</code> für BLAKE → ORA-01402","<code>SET sal = 3100</code> for JONES ✓ · <code>SET sal = 2500</code> for BLAKE → ORA-01402")}</p></div></div>
  <h2>WITH READ ONLY</h2>
  <div class="grid g2">${sql("CREATE OR REPLACE VIEW empvu10 AS\n  SELECT empno, ename, job\n  FROM   emp WHERE deptno = 10\n  WITH READ ONLY;\n\nDELETE FROM empvu10;\n-- ORA-42399: cannot perform a DML operation\n--            on a read-only view")}${table([L("Option","Option"), "SELECT", "DML"], [[L("(keine)","(none)"),"✓",L("✓ (einfache View)","✓ (simple view)")],["WITH CHECK OPTION","✓",L("nur im Fenster","only inside the window")],["WITH READ ONLY","✓","✗"]])}</div>`,
  init(el){ let smith = 20, msg = null;
   const IN20 = ["SMITH","JONES","SCOTT","ADAMS","FORD"];
   const draw = () => { const vis = IN20.filter(n => n !== "SMITH" || smith === 20);
    $("#swin", el).innerHTML = `<div class="cap">${L("Fenster empvu20 (deptno = 20)","window empvu20 (deptno = 20)")}</div><div class="card" style="background:color-mix(in srgb,var(--nv) 10%,var(--card))">${vis.map(n => `<span class="pill ${n === "SMITH" ? "or" : "nv"}">${n}</span>`).join(" ")}</div>` + (smith !== 20 ? `<p class="small" style="color:var(--rd)">${L(`SMITH ist jetzt in Abteilung ${smith} – durch das Fenster unsichtbar.`, `SMITH is now in department ${smith} – invisible through the window.`)}</p>` : "");
    $("#smsg", el).innerHTML = msg || `<p class="muted">${L("Wähle eine Abteilung für SMITH.","Choose a department for SMITH.")}</p>`; };

    if (smith !== 20) { msg = box("info", L("SMITH ist nicht mehr in der View","SMITH is no longer in the view"), L("0 rows updated – über empvu20 erreicht man ihn nicht mehr. ↺ zum Zurücksetzen.","0 rows updated – he can no longer be reached through empvu20. ↺ to reset.")); }
    else if (d === 20) msg = box("ok", "✓ 1 row updated.", L("SMITH bleibt im Fenster.","SMITH stays in the window."));
    else if (co) msg = box("warn", "✗ ORA-01402", L("view WITH CHECK OPTION where-clause violation – SMITH würde aus dem Fenster fallen.","view WITH CHECK OPTION where-clause violation – SMITH would fall out of the window."));
    else { smith = d; msg = box("ok", "1 row updated.", L("Ohne CHECK OPTION klappt es – aber SMITH ist danach über die View verschwunden.","Without CHECK OPTION it works – but afterwards SMITH has disappeared from the view.")); }

 {id:"mv", t:"Materialized Views", html:() => `<h2>${L("View oder Materialized View?","View or materialized view?")}</h2>
  <div class="grid g2"><div class="card"><b>📖 View</b><p class="small">${L("Rezept – bei jedem Aufruf neu kochen: immer frisch, kostet Zeit.","Recipe – cook again for every call: always fresh, takes time.")}</p></div><div class="card"><b>📦 Materialized View</b><p class="small">${L("Vorgekocht im Kühlschrank: sofort da, braucht Platz, frisch erst nach dem nächsten Refresh.","Pre-cooked in the fridge: there immediately, needs space, fresh only after the next refresh.")}</p></div></div>
  ${table(["", "View", "Materialized View"], [[L("speichert","stores"),L("nur die Abfrage","only the query"),L("Abfrage und Ergebnis","query and result")],[L("Speicherplatz","storage"),L("keiner","none"),L("wie eine Tabelle","like a table")],[L("Aktualität","up to date"),L("immer","always"),L("Stand des letzten Refresh","state of the last refresh")],[L("Geschwindigkeit","speed"),L("rechnet jedes Mal","calculates every time"),L("sehr schnell","very fast")]])}
  <h2>${L("Refresh-Labor","Refresh lab")}</h2>
  <div class="grid g2">${sql("CREATE MATERIALIZED VIEW emp_dept_mv\n  (mitarbeiter, gehalt, abteilung)\n  BUILD IMMEDIATE\n  REFRESH COMPLETE ON DEMAND\nAS\n  SELECT e.ename, e.sal, d.dname\n  FROM   emp e JOIN dept d\n         ON e.deptno = d.deptno\n  WHERE  e.sal > 2000;")}
   <div class="card"><div class="row" id="mm"><button class="chip on" data-m="demand">ON DEMAND</button><button class="chip" data-m="commit">ON COMMIT</button></div>
    <div class="row" id="mb" style="margin-top:8px"><button class="btn sm" data-b="upd">UPDATE emp SET sal = sal + 1000 WHERE ename = 'KING';</button><button class="btn sm nv" data-b="commit">COMMIT</button><button class="btn sm" data-b="ref">DBMS_MVIEW.REFRESH</button><button class="btn sm ghost" data-b="x">↺</button></div>
    <div id="mv" style="margin-top:8px"></div></div></div>
  <h2>${L("Optionen","Options")}</h2>
  ${table([L("Klausel","Clause"), L("Werte","Values")], [["BUILD",L("IMMEDIATE (sofort füllen) · DEFERRED (beim ersten Refresh)","IMMEDIATE (fill now) · DEFERRED (at the first refresh)")],["REFRESH",L("COMPLETE (alles neu) · FAST (nur Änderungen, braucht MV-Log) · FORCE (FAST, sonst COMPLETE)","COMPLETE (all new) · FAST (only changes, needs MV log) · FORCE (FAST, else COMPLETE)")],["ON",L("DEMAND (auf Befehl) · COMMIT (nach jedem COMMIT)","DEMAND (on command) · COMMIT (after every COMMIT)")],["ENABLE QUERY REWRITE",L("Optimizer darf Abfragen automatisch auf die MV umleiten","optimizer may automatically redirect queries to the MV")]])}
  ${box("info",L("Gut zu wissen","Good to know"),L("Recht nötig: <code>CREATE MATERIALIZED VIEW</code> · Data Dictionary: <code>USER_MVIEWS</code> (LAST_REFRESH_DATE, STALENESS) · Löschen: <code>DROP MATERIALIZED VIEW</code>","Privilege needed: <code>CREATE MATERIALIZED VIEW</code> · data dictionary: <code>USER_MVIEWS</code> (LAST_REFRESH_DATE, STALENESS) · drop: <code>DROP MATERIALIZED VIEW</code>"))}`,
  init(el){ let mode = "demand", tab = 5000, saved = 5000, mv = 5000, open = false, log = "";
   const draw = () => { $$("#mm .chip", el).forEach(x => x.classList.toggle("on", x.dataset.m === mode));
    const stale = mv !== saved;
    $("#mv", el).innerHTML = table([L("Objekt","Object"), L("KING · sal","KING · sal"), L("Status","Status")], [["EMP " + L("(meine Sitzung)","(my session)"), tab, open ? L("offen","open") : L("gespeichert","committed")],["View salary_vu", tab, L("immer aktuell","always up to date")],["emp_dept_mv", mv, stale ? "STALE" : "FRESH"]], {hlRows: stale ? [2] : []}) + (log ? `<p class="small">${log}</p>` : ""); };
   $("#mm", el).onclick = e => { const b = e.target.closest("[data-m]"); if (b) { mode = b.dataset.m; draw(); } };
   $("#mb", el).onclick = e => { const b = e.target.closest("[data-b]"); if (!b) return; const c = b.dataset.b;
    if (c === "upd") { tab += 1000; open = true; log = L("Änderung offen – noch kein COMMIT.","Change open – no COMMIT yet."); }
    if (c === "commit") { if (open) { saved = tab; open = false; if (mode === "commit") { mv = saved; log = L("ON COMMIT: Die MV wird beim COMMIT automatisch nachgezogen.","ON COMMIT: the MV is updated automatically at COMMIT."); } else log = L("ON DEMAND: Die MV zeigt noch den alten Wert – sie ist STALE.","ON DEMAND: the MV still shows the old value – it is STALE."); } else log = L("nichts zu speichern","nothing to save"); }
    if (c === "ref") { mv = saved; log = L("Refresh: Die MV wird neu berechnet (Stand des letzten COMMIT).","Refresh: the MV is recalculated (state of the last COMMIT)."); }
    if (c === "x") { tab = saved = mv = 5000; open = false; log = ""; }
    draw(); }; draw(); }},

const RX = [
 [/^(\d+) % erledigt$/, "$1 % done"], [/^Gesamtfortschritt: (\d+) %$/, "Overall progress: $1 %"],
 [/^(\d+) Zeilen$/, "$1 rows"], [/^(\d+) Zeile$/, "$1 row"], [/^(\d+) Treffer$/, "$1 matches"], [/^(\d+) von 14 Zeilen$/, "$1 of 14 rows"],
 [/^Foliensatz (\d+)$/, "Slide deck $1"], [/^Aufgabe (.+)$/, "Task $1"], [/^Schritt (\d+):$/, "Step $1:"],
 [/^Oracle-SQL-Notebook (.+)$/, (m, a) => "Oracle SQL notebook " + (T(a) ?? a.replace("Modul", "module"))],
 [/^Bis dahin: Foliensatz (\d+) aus dem Unterricht und das passende SQL-Notebook\.$/, "Until then: slide deck $1 from class and the matching SQL notebook."],
 [/^A ist abgebucht – B hat das Geld noch nicht\. Summe: (\d+) € statt 1200 €!$/, "A has been debited – B doesn't have the money yet. Total: €$1 instead of €1200!"],
 [/^▶ Weiter mit Modul (\d+): (.+)$/, (m, n, t) => `▶ Continue with module ${n}: ${T(t) ?? t}`],
 [/^(\d+)\. (.+)$/, (m, n, t) => { const r = T(t); return r == null ? null : `${n}. ${r}`; }],
 [/^← (.+)$/, (m, t) => { const r = T(t); return r == null ? null : "← " + r; }],
 [/^-- (\d+) Zeilen$/, "-- $1 rows"]
];
function T(s){
  if (Object.prototype.hasOwnProperty.call(EN, s)) return EN[s];
  for (const [re, f] of RX) { const m = s.match(re); if (m) { const r = typeof f === "function" ? f(...m) : s.replace(re, f); if (r != null) return r; } }
  return null;
}
function trNode(root){
  if (LANG !== "en" || !root) return;
  const doText = n => {
    const par = n.parentElement; if (!par || par.closest("script,style,[data-notr]")) return;
    if (par.closest("pre") && !par.classList.contains("c")) return;
    const t = n.data.trim(); if (!t) return; const r = T(t); if (r != null && r !== t) n.data = n.data.replace(t, r);
  };
  if (root.nodeType === 3) return doText(root);
  if (root.nodeType !== 1) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n; const list = [];
  while ((n = w.nextNode())) list.push(n);
  list.forEach(doText);
  [root, ...root.querySelectorAll("[placeholder],[title]")].forEach(e => {
    if (!e.getAttribute) return;
    ["placeholder", "title"].forEach(a => { const v = e.getAttribute(a); if (v) { const r = T(v.trim()); if (r != null) e.setAttribute(a, r); } });
  });
}
const obs = new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(trNode)));
function initLang(){
  document.documentElement.lang = LANG;
  $("#langBtn").textContent = LANG === "en" ? "DE" : "EN";
  if (LANG === "en") { document.title = "DBI – Databases and Information Systems · Year 3"; trNode(document.body); obs.observe(document.body, {childList: true, subtree: true}); }
  $("#langBtn").onclick = () => { try { localStorage.setItem("dbi3-lang", LANG === "en" ? "de" : "en"); } catch (e) {} try { sessionStorage.setItem("dbi3-route", ROUTE); } catch (e) {} try { location.reload(); } catch (e) {} };
}
// ---- Beamer
function setBeamer(on){
  document.documentElement.classList.toggle("beamer", on);
  try { localStorage.setItem("dbi3-beamer", on ? "1" : ""); } catch (e) {}
  $("#beamerBtn").classList.toggle("on", on);
  if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
function stepSection(dir){
  const tabs = $$(".tabs .tab"); if (!tabs.length) return;
  const i = tabs.findIndex(t => t.classList.contains("on")); const j = i + dir;
  if (j >= 0 && j < tabs.length) go(tabs[j].getAttribute("href"));
}
function initBeamer(){
  let b = false; try { b = localStorage.getItem("dbi3-beamer") === "1"; } catch (e) {}
  setBeamer(b);
  $("#beamerBtn").onclick = () => setBeamer(!document.documentElement.classList.contains("beamer"));
  document.addEventListener("keydown", e => {
    if (!document.documentElement.classList.contains("beamer") || e.target.closest("input,textarea,select")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); stepSection(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); stepSection(-1); }
    else if (e.key === "f" || e.key === "F") { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); }
    else if (e.key === "Escape") setBeamer(false);
  });
}
